<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060809">
<meta name="apple-mobile-web-app-title" content="Xpend">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060809'/%3E%3Cpath d='M20 20l24 24M44 20 20 44' stroke='%23F8F8F8' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Xpend</title>
<style>
/* ============================ DESIGN TOKENS (UI_DESIGN_SPEC.md) ============================ */
:root{
  --bg:#060809;          /* app background */
  --bg-elev:#090B0C;
  --card:#0D1113;        /* faint card lift */
  --surface:#1E252B;     /* sheet surface */
  --surface-2:#171B1E;
  --control:#2B3339;     /* control fill */
  --faint:rgba(255,255,255,.06);
  --text:#F5F5F5;
  --text-2:#B9BEC2;
  --muted:#777B7E;
  --muted-2:#85898C;
  --handle:#60666A;      /* drag handle */
  --sel:#F8F8F8;         /* selected circle */
  --sel-txt:#111111;
  --scrim:rgba(0,0,0,.68);
  --inc:#5BB98C;         /* muted income green */
  --neg:#C05B4D;         /* muted over-budget red */
  --teal:#3A9586;        /* muted accent (star badge) */
  --r-sheet:36px;        /* sheet top radius */
  --r-card:26px;
  --r-pill:999px;
  --tab-h:74px;
  --rail-w:96px;
  --fs: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--fs);
  font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{
  font-family:inherit;color:inherit;background:none;border:0;
  cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{font-family:inherit;color:var(--text)}
svg{display:block}
::-webkit-scrollbar{width:0;height:0}

/* ============================ APP SHELL ============================ */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100svh;height:100dvh;
  background:var(--bg);
}
/* Standalone (home-screen) iOS: force the app to span the visible + safe base area.
   `100dvh` reflects the true dynamic viewport incl. bars; `env()` covers the notch/home bar. */
@media (display-mode: standalone){
  #app{height:calc(100dvh + env(safe-area-inset-bottom,0px))}
  html,body{height:calc(100dvh + env(safe-area-inset-bottom,0px))}
}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.scr{padding:calc(4px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}
.scr.pad-nav{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* ============================ NAV (bottom bar / desktop rail) ============================ */
#nav{
  z-index:40;
  flex:none;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding:6px 10px env(safe-area-inset-bottom,0px);
  display:flex;align-items:stretch;justify-content:space-around;
  background:rgba(30,37,43,.72);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border-top:.5px solid rgba(255,255,255,.07);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.02em;
  border-radius:18px;min-width:52px;
}
.nav-item .ni-ic{width:27px;height:27px}
.nav-item.on{color:var(--text)}
.nav-item.on .ni-ic{color:var(--text)}
.nav-add{
  flex:0 0 58px;align-self:center;
  width:56px;height:56px;border-radius:50%;
  background:var(--sel);color:var(--sel-txt);
  display:flex;align-items:center;justify-content:center;
  transform:translateY(-8px);
}
.nav-add .ni-ic{width:26px;height:26px}
.nav-add.on{outline:2.5px solid var(--control)}

/* ============================ HEADERS ============================ */
.scrhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-size:30px;font-weight:700;letter-spacing:-.02em}
.cbtn{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--control);color:#DFE3E6;
  display:grid;place-items:center;
}
.cbtn svg{width:20px;height:20px}
.cbtn.small{width:34px;height:34px}
.cbtn.small svg{width:17px;height:17px}
.cbtn:active{background:#393f46}

/* segmented control */
.seg{
  display:flex;background:var(--control);border-radius:var(--r-pill);
  padding:3px;gap:2px;
}
.seg button{
  padding:7px 14px;border-radius:var(--r-pill);
  font-size:13px;font-weight:600;color:var(--muted-2);letter-spacing:.01em;
}
.seg button.on{background:var(--surface-2);color:var(--text)}

/* ============================ CARDS & ROWS ============================ */
.card{
  background:var(--card);border-radius:var(--r-card);
  padding:18px;margin-bottom:14px;
}
.card-title{
  font-size:13px;font-weight:600;color:var(--muted-2);
  text-transform:uppercase;letter-spacing:.09em;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.card-title .link{color:var(--text-2);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}

.ccircle{
  --c:#777B7E;
  width:34px;height:34px;border-radius:50%;flex:none;
  background:var(--c);color:#0B0B0C;
  display:grid;place-items:center;
  font-size:14px;font-weight:700;
}
.ccircle.lg{width:46px;height:46px;font-size:18px}
.ccircle.small{width:30px;height:30px;font-size:12.5px}
.ccircle svg{width:17px;height:17px;color:#D6DADD}

/* amount */
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.amt.inc{color:var(--inc)}
.amt.neg{color:var(--neg)}
.amt.dim{color:var(--muted)}

/* ============================ DONUT ============================ */
.donut-wrap{position:relative;width:min(230px,62vw);margin:6px auto 4px}
.donut-wrap svg{width:100%;height:auto}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-align:center;
}
.dc-main{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dc-sub{font-size:13px;color:var(--muted)}
.donut-foot{
  display:flex;justify-content:space-between;margin-top:14px;
  padding-top:14px;border-top:.5px solid rgba(255,255,255,.07);
  font-size:14px;color:var(--text-2);
}
.donut-foot b{color:var(--text);font-weight:700}
.remain-row{display:flex;justify-content:space-between;margin-top:12px;font-size:14.5px}

/* breakdown rows */
.brow{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:10px 2px;text-align:left;border-radius:14px;
}
.brow:active{background:var(--faint)}
.brow .bname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
.brow .bpct{font-size:13px;color:var(--muted);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.brow .bamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* transaction rows */
.trow{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:11px 2px;text-align:left;border-radius:14px;
}
.trow:active{background:var(--faint)}
.trow-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tname{font-size:15.5px;font-weight:500}
.tsub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tamt.inc{color:var(--inc)}

/* day group headers */
.dg-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:18px 2px 6px;font-size:13px;
}
.dg-day{font-weight:600;color:var(--text-2);text-transform:capitalize}
.dg-total{color:var(--muted);font-variant-numeric:tabular-nums}

/* ============================ CHIPS & SEARCH ============================ */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.chip{
  flex:none;padding:8px 16px;border-radius:var(--r-pill);
  background:var(--control);color:var(--muted-2);font-size:13.5px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.on{background:var(--text);color:var(--bg)}
.chip.on .dot{background:var(--bg)}
.search{
  display:flex;align-items:center;gap:10px;
  background:var(--control);border-radius:16px;padding:0 14px;height:46px;margin-bottom:6px;
  overflow:hidden;
}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;height:100%;margin:0 !important;padding:0 !important;width:0;background:none;border:0;outline:0;font-size:15.5px;line-height:normal;color:var(--text)}
.search input::placeholder{color:var(--muted)}

/* ============================ SETTINGS ROWS / TOGGLES ============================ */
.set{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left}
.set .s-label{flex:1;font-size:15.5px}
.set .s-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.set:active{background:var(--faint)}
.set > svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.set.gh{color:inherit;text-decoration:none}
.switch{width:50px;height:30px;border-radius:99px;background:var(--control);position:relative;flex:none;transition:background .2s}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#8B9094;transition:.2s;
}
.switch.on{background:var(--control)}
.switch.on::after{background:var(--sel);transform:translateX(20px)}
select.sel{
  background:var(--control);border:0;color:var(--text);border-radius:12px;
  padding:10px 34px 10px 14px;font-size:14.5px;font-weight:600;outline:0;
  -webkit-appearance:none;appearance:none;
}
.slab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.slab+ .slab{border-top:.5px solid rgba(255,255,255,.06)}
.sec-label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 2px 6px}

/* ============================ BUTTONS ============================ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  height:56px;border-radius:var(--r-pill);
  background:var(--sel);color:var(--sel-txt);
  font-size:16.5px;font-weight:700;
}
.btn svg{width:21px;height:21px}
.btn.ghost{background:var(--control);color:var(--text)}
.btn.mini{height:44px;font-size:14.5px;padding:0 18px;width:auto}
.btn.danger{background:rgba(192,91,77,.13);color:var(--neg)}
.btn.disabled{opacity:.35;pointer-events:none}

/* ============================ BOTTOM SHEET (spec-faithful) ============================ */
#scrim{
  position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;pointer-events:none}
.sheet{
  pointer-events:auto;
  width:100%;max-width:460px;
  background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 22px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  max-height:88svh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
}
.sheet.up{transform:translateY(0)}
.sh-grab{width:48px;height:5px;border-radius:99px;background:var(--handle);margin:10px auto 8px;flex:none}
.sh-title{font-size:20px;font-weight:700;padding:8px 2px 12px;letter-spacing:-.01em}
.sh-row{
  display:flex;align-items:center;gap:13px;width:100%;padding:13px 4px;text-align:left;border-radius:14px;
}
.sh-row:active{background:var(--faint)}
.sh-row .rname{flex:1;font-size:15.5px}
.sh-row .rbal{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sh-row > svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.sh-row.sel .rname{font-weight:700}

/* ---- date picker (spec §12) ---- */
.dp-head{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
.dp-title{font-size:21px;font-weight:700;margin-right:auto;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{
  text-align:center;font-size:12.5px;font-weight:600;color:var(--muted-2);
  padding-bottom:8px;
}
.cal-day{
  position:relative;aspect-ratio:1;display:grid;place-items:center;
  font-size:16px;color:#F0F0F0;border-radius:50%;
}
.cal-day:active{background:var(--faint)}
.cal-day.sel{background:var(--sel);color:var(--sel-txt);font-weight:700}
.cal-day.today::after{
  content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--teal);
}
.cal-day.sel.today::after{background:var(--sel-txt)}
.cal-grid i{aspect-ratio:1}

/* ---- category picker ---- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.cat-chip{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0}
.cat-chip .ccircle{width:52px;height:52px;font-size:17px;transition:box-shadow .15s}
.cat-chip.sel .ccircle{box-shadow:0 0 0 2.5px var(--text)}
.cat-chip .cname{font-size:11.5px;color:var(--muted-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-chip.sel .cname{color:var(--text)}

/* ============================ ADD-EXPENSE SCREEN (spec §26-30) ============================ */
.add-top{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.add-top-col{display:flex;gap:12px;align-items:center}
.starbtn{position:relative}
.star-badge{
  position:absolute;top:-2px;right:-2px;width:19px;height:19px;border-radius:50%;
  background:var(--teal);color:#06120F;display:grid;place-items:center;
}
.star-badge svg{width:11px;height:11px}
.add-amount{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 0 6px;min-height:72px;
}
.add-amount .cur{font-size:.42em;font-weight:700;color:var(--muted-2);margin-top:.34em}
.add-amount .num{
  font-size:clamp(58px,19vw,84px);font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.add-amount .num.small{font-size:clamp(42px,14vw,62px)}
.close-cap{
  align-self:center;margin-left:14px;
  width:44px;height:44px;border-radius:var(--r-pill);
  background:var(--control);color:#DFE3E6;display:grid;place-items:center;flex:none;
}
.close-cap svg{width:19px;height:19px}
.add-fields{display:flex;flex-direction:column;margin:6px 0 14px}
.field{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 4px;text-align:left;
}
.field+.field{border-top:.5px solid rgba(255,255,255,.06)}
.field .f-name{flex:1;font-size:16px}
.field .f-val{color:var(--muted-2);font-size:15px;font-variant-numeric:tabular-nums}
.field > svg{width:18px;height:18px;color:var(--muted)}
.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  padding:2px 0 8px;
}
.kbtn{
  height:48px;border-radius:20px;background:var(--card);
  color:var(--text);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
}
.kbtn:active{background:var(--control)}
.kbtn svg{width:26px;height:26px;color:var(--text-2)}
.kbtn.tick{background:var(--sel);color:var(--sel-txt)}
.kbtn.tick svg{width:28px;height:28px;color:var(--sel-txt)}
.rate-note{text-align:center;font-size:12.5px;color:var(--muted);padding-bottom:4px}

/* ============================ TOAST ============================ */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom,0px));z-index:90;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--surface);color:var(--text);
  padding:12px 22px;border-radius:var(--r-pill);
  font-size:14.5px;font-weight:600;letter-spacing:.01em;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:.5px solid rgba(255,255,255,.09);
  transition:.25s ease;white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ============================ EMPTY STATES ============================ */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;margin:0 auto 14px;opacity:.5}
.empty .t{font-size:16px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.empty .s{font-size:13.5px}

.progress{height:9px;border-radius:99px;background:var(--control);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--text)}
.progress.over i{background:var(--neg)}

/* budget card bits */
.bud-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bud-top .bname-h{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--muted)}
.bud-meta b{color:var(--text);font-variant-numeric:tabular-nums}

/* note text */
.note-ico{font-size:15px;color:var(--muted-2)}
input[type=text],textarea.tx{
  width:100%;background:var(--control);border:0;border-radius:16px;
  padding:15px 16px;font-size:16px;outline:0;margin:4px 0 14px;
}
textarea.tx{resize:none;font-family:none;min-height:64px}

/* ============================ DESKTOP RAIL (≥768px) ============================ */
@media (min-width:768px){
  #app{flex-direction:row;max-width:1120px;margin:0 auto;border-left:.5px solid rgba(255,255,255,.05);border-right:.5px solid rgba(255,255,255,.05)}
  #screen{order:2}
  #nav{
    position:static;order:1;flex:none;width:var(--rail-w);
    height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 0 18px;gap:6px;
    background:rgba(13,17,19,.9);border-top:0;border-right:.5px solid rgba(255,255,255,.06);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .nav-item{flex:none;padding:12px 6px;gap:5px}
  .nav-item .ni-ic{width:26px;height:26px}
  .nav-add{flex:0 0 auto;width:52px;height:52px;align-self:center;margin:6px 0;transform:none}
  .nav-spacer{flex:1}
  .scr{padding:calc(8px + env(safe-area-inset-top,0px)) 30px 40px;max-width:860px;margin:0 auto;width:100%}
  .split-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
  .split-2 .card{margin-bottom:14px}
}
</style>
</head>
<body>
<div id="app">
  <main id="screen"></main>
  <nav id="nav" aria-label="Tabs"></nav>
</div>
<div id="scrim" data-act="close-sheet"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================ HELPERS ============================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const $=q=>document.querySelector(q);
const pad=n=>String(n).padStart(2,"0");
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function monthKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function parseMk(k){const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,1)}
function todayStr(){return dstr(new Date())}

function rupees(p,opts){
  opts=opts||{};
  if(App&&App.data&&App.data.settings&&App.data.settings.hideBalances&&!opts.show)return "₹••••";
  const r=Math.abs(p||0)/100;
  const whole=Math.floor(r),paise=Math.round((r-whole)*100);
  const showPaise = (p%100)!==0 ;
  let str=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",currencyDisplay:"symbol",
    minimumFractionDigits:0,maximumFractionDigits:0}).format(whole);
  if(showPaise)str+= "."+pad(paise);
  return p<0?"-"+str:str;
}

/* ============================ STORAGE (IDB → localStorage → memory) ============================ */
const Store={
  kind:"mem",db:null,mem:{},
  init(){return new Promise(res=>{
    let localOk=false;try{localStorage.setItem("__q","1");localStorage.removeItem("__q");localOk=true}catch(e){}
    this._k=localOk?"local":"mem";
    let idb=null;try{idb=window.indexedDB}catch(e){}
    if(!idb){this.kind=this._k;return res(this)}
    try{
      const rq=idb.open("xpend",1);
      rq.onupgradeneeded=e=>{e.target.result.createObjectStore("kv")};
      rq.onsuccess=()=>{this.db=rq.result;this.kind="idb";this.migrate().then(()=>res(this))};
      rq.onerror=()=>{this.kind=this._k;res(this)};
      rq.onblocked=()=>{this.kind=this._k;res(this)};
    }catch(e){this.kind=this._k;res(this)}
  })},
  _has(k){return new Promise(r=>{
    try{const st=this.db.transaction("kv");const t=st.objectStore("kv").get(k);t.onsuccess=()=>r(t.result!=null);t.onerror=()=>r(false)}catch(e){r(false)}
  })},
  _put(k,v){return new Promise(r=>{
    try{const t=this.db.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}
  })},
  async migrate(){
    if(!(await this._has("doc"))){
      /* legacy IDB db from the "quanto" era */
      try{
        const old=await new Promise(r=>{const q=indexedDB.open("quanto",1);q.onupgradeneeded=()=>{};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
        if(old){
          try{
            const doc=await new Promise(r=>{try{const t=old.transaction("kv").objectStore("kv").get("doc");t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
            if(doc)await this._put("doc",doc);
          }catch(e){}
          try{old.close()}catch(e){}
        }
      }catch(e){}
    }
    /* legacy localStorage prefix */
    try{
      const oldR=localStorage.getItem("quanto:doc");
      if(oldR){
        localStorage.setItem("xpend:doc",oldR);localStorage.removeItem("quanto:doc");
      }
      const newR=localStorage.getItem("xpend:doc");
      if(newR&&this.kind==="idb"){await this._put("doc",JSON.parse(newR));localStorage.removeItem("xpend:doc")}
    }catch(e){}
  },
  get(k){return new Promise(res=>{
    if(this.kind==="idb"){
      let t=null;try{const st=this.db.transaction("kv");t=st.objectStore("kv").get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}
    }else if(this.kind==="local"){try{const r=localStorage.getItem("xpend:"+k);res(r?JSON.parse(r):null)}catch(e){res(null)}}
    else{res(k in this.mem?this.mem[k]:null)}
  })},
  set(k,v){return new Promise(res=>{
    if(this.kind==="idb"){
      try{const t=this.db.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}
    }else if(this.kind==="local"){try{localStorage.setItem("xpend:"+k,JSON.stringify(v));res(true)}catch(e){res(false)}}
    else{this.mem[k]=v;res(true)}
  })}
};

/* ============================ CRYPTO (WebCrypto AES-256-GCM + PBKDF2) ============================ */
const C={
  b64(u){let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},
  unb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u},
  rand(n){return crypto.getRandomValues(new Uint8Array(n))},
  der(pass,salt){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"])
      .then(k=>crypto.subtle.deriveKey({name:"PBKDF2",salt:this.unb(salt),iterations:210000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]));
  },
  enc(key,str){
    const iv=this.rand(12);
    return crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(str))
      .then(ct=>({iv:this.b64(iv),ct:this.b64(new Uint8Array(ct))}));
  },
  dec(key,iv,ct){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:this.unb(iv)},key,this.unb(ct))
      .then(pt=>new TextDecoder().decode(pt));
  },
  sup(){return !!(window.crypto&&window.crypto.subtle&&crypto.getRandomValues)}
};

/* ============================ GIST BACKUP (M5) ============================ */
const Gist={
  key:null,_t:null,

  cfg(){return App.data&&App.data.settings&&App.data.settings.gist},
  connected(){const c=this.cfg();return !!c&&!!c.gistId},
  unlocked(){return !!this.key},
  dirty(){const c=this.cfg();return !!(c&&c.dirty)},

  saveCfg(){Store.set("doc",App.data)},

  /* persist the derived key so reloads can auto-unlock and pull */
  kStore(){
    if(!this.key)return Promise.resolve();
    return crypto.subtle.exportKey("raw",this.key).then(b=>{
      let s="";const u=new Uint8Array(b);
      for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
      try{localStorage.setItem("xpend:k",btoa(s))}catch(e){}
    });
  },
  kLoad(){
    const s=localStorage.getItem("xpend:k");
    if(!s)return Promise.resolve(false);
    try{
      const b=atob(s),u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      return crypto.subtle.importKey("raw",u,"AES-GCM",false,["encrypt","decrypt"])
        .then(k=>{this.key=k;return true}).catch(()=>false);
    }catch(e){return Promise.resolve(false)}
  },
  kClear(){try{localStorage.removeItem("xpend:k")}catch(e){}},

  pat(){
    const c=this.cfg();
    return C.dec(this.key,c.patCipher.iv,c.patCipher.ct).then(p=>p.trim());
  },
  api(method,path,body){
    return this.pat().then(pat=>{
      const h={"Accept":"application/vnd.github+json","Authorization":"token "+pat};
      return fetch("https://api.github.com"+path,{method,headers:h,body:body?JSON.stringify(body):undefined})
        .then(r=>{
          if(!r.ok)return r.json().then(j=>{throw new Error(j.message||"HTTP "+r.status)});
          return r.status===204?null:r.json();
        });
    });
  },

  envelope(salt){
    return C.enc(this.key,JSON.stringify(App.data)).then(e=>({v:1,kdf:{alg:"PBKDF2-SHA256",iterations:210000,salt},cipher:"AES-256-GCM",iv:e.iv,ct:e.ct}));
  },

  /* runs on every data mutation */
  onChange(){
    if(!this.connected())return;
    const c=this.cfg();
    c.dirty=true;this.saveCfg();
    if(!this.key)return;                        /* locked: queued, push runs after unlock */
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.push().catch(e=>App.toast("Backup failed")),2000);
  },

  async push(force){
    const c=this.cfg();
    if(!this.connected()||!this.key)return;
    if(!force&&!c.dirty)return;
    const gistId=c.gistId;
    const env=await this.envelope(c.salt);
    await this.api("PATCH","/gists/"+gistId,{files:{"xpend-backup.json":{content:JSON.stringify(env)}}});
    if(gistId===this.cfg().gistId){this.cfg().dirty=false;this.cfg().lastPushedAt=new Date().toISOString();this.saveCfg()}
  },

  async setup(pass,pat){
    if(!C.sup||!window.fetch)throw new Error("WebCrypto or fetch unavailable");
    pat=pat.trim();
    const salt=C.b64(C.rand(16));
    this.key=await C.der(pass,salt);
    await this.kStore();
    const pc=await C.enc(this.key,pat);
    App.data.settings.gist={gistId:null,salt,patCipher:pc,dirty:true};
    const env=await this.envelope(salt);
    const g=await this.api("POST","/gists",{description:"Xpend encrypted backup",public:false,files:{"xpend-backup.json":{content:JSON.stringify(env)}}});
    App.data.settings.gist.gistId=g.id;
    App.data.settings.gist.dirty=false;
    App.data.settings.gist.lastPushedAt=new Date().toISOString();
    this.saveCfg();
  },

  /* Connect = find an existing backup and restore it, trying each gist until
     the passphrase matches. Creates a new gist ONLY when no backup exists. */
  async connect(pass,pat){
    if(!C.sup()||!window.fetch)throw new Error("WebCrypto or fetch unavailable");
    pat=pat.trim();
    const h={"Accept":"application/vnd.github+json","Authorization":"token "+pat};
    const raw=await fetch("https://api.github.com/gists?per_page=100",{headers:h});
    if(!raw.ok){const j=await raw.json().catch(()=>({}));throw new Error(j.message||"HTTP "+raw.status)}
    const list=await raw.json();
    const cands=(list||[])
      .filter(g=>g.files&&g.files["xpend-backup.json"])
      .sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
    if(cands.length){
      for(const cand of cands){
        try{
          const gid=cand.id;
          const g=await fetch("https://api.github.com/gists/"+gid,{headers:h})
            .then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)));
          const file=g.files&&g.files["xpend-backup.json"];
          if(!file)continue;
          const env=JSON.parse(file.content);
          if(!env||env.v!==1||!env.kdf||!env.kdf.salt)continue;
          const key=await C.der(pass,env.kdf.salt);
          const doc=JSON.parse(await C.dec(key,env.iv,env.ct));
          if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))continue;
          this.key=key;await this.kStore();
          const prev=doc.settings&&doc.settings.gist;
          doc.settings=doc.settings||{};
          doc.settings.gist={gistId:gid,salt:env.kdf.salt,patCipher:await C.enc(key,pat),dirty:false,
            lastPushedAt:(prev&&prev.lastPushedAt)||undefined};
          App.data=doc;this.saveCfg();
          return {restored:true,gistId:gid};
        }catch(e){/* wrong passphrase for this backup — try the next one */}
      }
      const err=new Error("Wrong passphrase or corrupt backup");err.name="OperationError";throw err;
    }
    await this.setup(pass,pat);
    return {restored:false,gistId:this.cfg().gistId};
  },

  async unlock(pass){
    const c=this.cfg();
    if(!c||!c.salt)throw new Error("No backup configured");
    const k=await C.der(pass,c.salt);
    await C.dec(k,c.patCipher.iv,c.patCipher.ct);   /* verify without leaving a bad key installed */
    this.key=k;await this.kStore();
    if(c.dirty){setTimeout(()=>this.push().catch(()=>{}),500);return false}
    const ok=await this.pull();
    if(ok)App.render();
    return ok;
  },

  /* Fetch the current gist backup and load it into the UI */
  async pull(){
    const c=this.cfg();
    if(!c||!c.gistId||!this.key)return false;
    try{
      const g=await this.api("GET","/gists/"+c.gistId);
      const file=g.files&&g.files["xpend-backup.json"];
      if(!file)return false;
      const env=JSON.parse(file.content);
      if(!env||env.v!==1||!env.kdf||!env.kdf.salt||!env.iv||!env.ct)return false;
      const doc=JSON.parse(await C.dec(this.key,env.iv,env.ct));
      if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))return false;
      doc.settings=doc.settings||{};
      if(!doc.settings.gist||!doc.settings.gist.gistId)doc.settings.gist=c;
      App.data=doc;
      this.saveCfg();
      return true;
    }catch(e){return false}
  },

  async restore(pass,gid){
    const c=this.cfg();
    if(!c)throw new Error("No backup configured");
    this.key=await C.der(pass,c.salt);              /* temp key: unlock the stored token */
    const tok=await this.pat();                     /* throws if passphrase is wrong */
    const g=await this.api("GET","/gists/"+((gid&&gid.trim())||c.gistId));
    const file=g.files&&g.files["xpend-backup.json"];
    if(!file)throw new Error("xpend-backup.json not found in gist");
    const env=JSON.parse(file.content);
    if(!env||env.v!==1)throw new Error("Unsupported backup format");
    if(!env.kdf||!env.kdf.salt)throw new Error("Unsupported backup format");
    const key=await C.der(pass,env.kdf.salt);       /* real key of this backup */
    this.key=key;
    await this.kStore();
    const doc=JSON.parse(await C.dec(key,env.iv,env.ct));
    if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))throw new Error("Not a Xpend backup");
    const prev=doc.settings&&doc.settings.gist;
    doc.settings=doc.settings||{};
    doc.settings.gist={gistId:g.id,salt:env.kdf.salt,patCipher:await C.enc(key,tok),dirty:false,
      lastPushedAt:(prev&&prev.lastPushedAt)||undefined};
    App.data=doc;
    this.saveCfg();
  },

  disconnect(){
    this.key=null;
    this.kClear();
    App.data.settings.gist=null;
    App.save();
  }
};

/* ============================ APP ============================ */
const TABS=[
  {id:"overview",label:"Overview",icon:IC.home},
  {id:"activity",label:"Activity",icon:IC.list},
  {id:"add",label:"Add",icon:IC.plus,add:true},
  {id:"budgets",label:"Budgets",icon:IC.target},
  {id:"accounts",label:"Accounts",icon:IC.wallet}
];

const App={
  data:null,view:"overview",prevView:"overview",
  mkey:monthKey(new Date()),
  add:null,dp:null,budSet:null,pendingDel:null,txOpen:null,
  flt:{q:"",dir:"all",cat:"all",acc:"all"},

  /* ---------- boot ---------- */
  async boot(){
    await Store.init();
    let d=null;try{d=await Store.get("doc")}catch(e){}
    if(!d)d=defaultDoc();
    if(!d.settings)d.settings=defaultDoc().settings;
    if(!Array.isArray(d.categories)||!d.categories.length)d.categories=JSON.parse(JSON.stringify(DEF_CATS));
    if(!Array.isArray(d.accounts)||!d.accounts.length)d.accounts=JSON.parse(JSON.stringify(DEF_ACCS));
    d.budgets=d.budgets||[];d.shortcuts=d.shortcuts||[];d.transactions=d.transactions||[];
    this.data=d;
    this.add=this.freshAdd();
    const now=new Date();this.dp={y:now.getFullYear(),m:now.getMonth()};
this.render();
    /* a connected app should live by its gist backup — auto-unlock (persisted key) or ask */
    if(Gist.connected()){
      Gist.kLoad().then(ok=>{
        if(ok){
          if(Gist.dirty())Gist.push().catch(()=>{});
          else Gist.pull().then(p=>{if(p)App.render()});
        }else{
          setTimeout(()=>{if(Gist.connected()&&!Gist.unlocked())App.openSheet(App.gbUnlockSheet())},350);
        }
      });
    }
  },
  freshAdd(){
    return {amount:"",dir:"expense",categoryId:"cat-o",accountId:this.data&&this.data.accounts[0]?this.data.accounts[0].id:"",
      date:todayStr(),note:""};
  },
  save(){
    this.data.meta.updatedAt=new Date().toISOString();
    Store.set("doc",this.data);
    Gist.onChange();
  },
  toast(msg){
    const t=$("#toast");t.textContent=msg;t.classList.add("on");
    clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove("on"),1900);
  },
  rerender(){this.render()},

  /* ---------- render ---------- */
  render(){
    this.renderNav();
    const scr=$("#screen");
    let html="";
    if(this.view==="add"){html=this.addScreen()}
    else if(this.view==="overview"){html=this.overview()}
    else if(this.view==="activity"){html=this.activity()}
    else if(this.view==="budgets"){html=this.budgets()}
    else if(this.view==="accounts"){html=this.accounts()}
    else if(this.view==="settings"){html=this.settings()}
    scr.innerHTML=html;
    scr.scrollTop=0;
  },
  renderNav(){
    const nav=$("#nav");
    nav.innerHTML=TABS.map(t=>{
      if(t.add){
        return `<button type="button" class="nav-item nav-add ${this.view==="add"?"on":""}" data-act="tab" data-tab="add" aria-label="${t.label}"><span class="ni-ic">${t.icon}</span></button>`;
      }
      return `<button type="button" class="nav-item ${this.view===t.id?"on":""}" data-act="tab" data-tab="${t.id}"><span class="ni-ic">${t.icon}</span><span>${t.label}</span></button>`;
    }).join("")+
    `<span class="nav-spacer"></span>`+
    `<button type="button" class="nav-item ${this.view==="settings"?"on":""}" data-act="tab" data-tab="settings" aria-label="Settings"><span class="ni-ic">${IC.gear}</span><span>Settings</span></button>`;
  },

  /* ---------- domain ---------- */
  sortedTxs(){
    return this.data.transactions.slice().sort((a,b)=>{
      if(a.date===b.date)return (b.createdAt||0)-(a.createdAt||0);
      return a.date<b.date?1:-1;
    });
  },
  monthStats(key){
    let spent=0,inc=0;
    for(const t of this.data.transactions){
      if(t.date.slice(0,7)!==key)continue;
      if(t.dir==="income")inc+=t.amount;else spent+=t.amount;
    }
    return {spent,inc,remaining:Math.max(0,inc-spent),pct:inc>0?Math.min(1,spent/inc):0};
  },
  catSpend(key){
    const map={};
    for(const t of this.data.transactions){
      if(t.dir==="expense"&&t.date.slice(0,7)===key)map[t.categoryId]=(map[t.categoryId]||0)+t.amount;
    }
    return map;
  },
  accBalance(id){
    const a=accById(id);let b=a? (a.opening||0):0;
    for(const t of this.data.transactions){
      if(t.accountId!==id)continue;
      b+=t.dir==="income"?t.amount:-t.amount;
    }
    return b;
  },
  budgetSpent(b){
    const key=this.mkey;let s=0;
    for(const t of this.data.transactions){
      if(t.dir!=="expense"||t.date.slice(0,7)!==key)continue;
      if(b.categoryIds&&b.categoryIds.length&&!b.categoryIds.includes(t.categoryId))continue;
      s+=t.amount;
    }
    return s;
  },
  catName(id){const c=catById(id);return c.name},

  /* ============ OVERVIEW ============ */

  /* ============ OVERVIEW ============ */
  overview(){
    const d=this.data,st=this.monthStats(this.mkey),mk=parseMk(this.mkey);

        stroke-dasharray="${Math.round(2*Math.PI*50)}" stroke-dashoffset="${Math.round(2*Math.PI*50*(1-st.pct))}" transform="rotate(-90 60 60)"/>`
      :`<circle cx="60" cy="60" r="50" fill="none" stroke="var(--control)" stroke-width="15"/>`;
    const hide=d.settings.hideBalances;
    return `
    <div class="scr">
      <header class="scrhdr">
        <div class="hdr-left">
          <button class="cbtn small" data-act="month-prev" aria-label="Previous month">${IC.left}</button>
          <button class="cbtn small" data-act="month-next" aria-label="Next month">${IC.right}</button>
          <div class="hdr-title">${esc(title)}</div>
        </div>
        <div class="hdr-left">
          <div class="seg" style="--h:0">
            <button>Month</button>
          </div>
        </div>
      </header>

      <div class="card">
        <div class="donut-wrap">
          <svg viewBox="0 0 120 120">${donut}</svg>
          <div class="donut-center">
            <div class="dc-main">${rupees(st.remaining)}</div>
            <div class="dc-sub">Remaining this month</div>
          </div>
        </div>
        <div class="donut-foot">
          <span>Spent <b>${rupees(st.spent)}</b></span>
          <span>Income <b>${rupees(st.inc)}</b></span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Spending${rows.length?`<button class="link" data-act="go-activity">See all</button>`:""}</div>
        ${rows.length?rows.map(([cid,amt],i)=>{
          const c=catById(cid);
          return `<button class="brow" data-act="ov-cat" data-id="${cid}">
            <span class="ccircle" style="--c:${c.color}">${init(c.name)}</span>
            <span class="bname">${esc(c.name)}</span>
            <span class="bpct">${Math.round(amt/st.spent*100)}%</span>
            <span class="bamt">${rupees(amt)}</span>
          </button>`;
        }).join(""):`<div class="empty"><div>${IC.empty}</div><div class="t">No spending yet</div><div class="s">Tap + to add your first expense</div></div>`}
      </div>

      ${phone?"":`
      <div class="card">
        <div class="card-title">Recent${recent.length?`<button class="link" data-act="go-activity">View all</button>`:""}</div>
        ${recent.length?recent.map(t=>this.txRow(t,true)).join(""):
          `<div class="empty"><div class="t">Nothing here</div><div class="s">Your latest transactions will show up here</div></div>`}
      </div>`}
    </div>`;
  },

  /* ============ ACTIVITY ============ */
  activity(){
    const d=this.data,flt=this.flt;
    let list=this.sortedTxs();
    if(flt.dir!=="all")list=list.filter(t=>t.dir===flt.dir);
    if(flt.cat!=="all")list=list.filter(t=>t.categoryId===flt.cat);
    if(flt.acc!=="all")list=list.filter(t=>t.accountId===flt.acc);
    if(flt.q)list=list.filter(t=>{
      const hay=(t.note||"")+" "+(this.catName(t.categoryId)||"")+" "+t.date;
      return hay.toLowerCase().includes(flt.q.toLowerCase());
    });
    const groups=[];
    for(const t of list){
      let g=groups[groups.length-1];
      if(!g||g.date!==t.date){g={date:t.date,items:[]};groups.push(g)}
      g.items.push(t);
    }
    const cats=d.categories;
    return `
    <div class="scr">
      <header class="scrhdr"><div class="hdr-title">Activity</div><div class="hdr-left"><button class="cbtn small" data-act="go-settings" aria-label="Settings">${IC.gear}</button></div></header>

      <div class="search">${IC.search}<input type="text" placeholder="Search transactions" value="${esc(flt.q)}" oninput="App.onSearch(this.value)"></div>

      <div class="chip-row">
        <button class="chip ${flt.dir==="all"?"on":""}" data-act="fd" data-f="dir" data-v="all">All</button>
        <button class="chip ${flt.dir==="expense"?"on":""}" data-act="fd" data-f="dir" data-v="expense">Expense</button>
        <button class="chip ${flt.dir==="income"?"on":""}" data-act="fd" data-f="dir" data-v="income">Income</button>
        ${cats.filter(c=>c.kind==="expense").map(c=>`<button class="chip ${flt.cat===c.id?"on":""}" data-act="fd" data-f="cat" data-v="${c.id}"><span class="dot" style="--c:${c.color}"></span>${esc(c.name)}</button>`).join("")}
      </div>

      ${groups.length?groups.map(g=>{
        const dayTotal=g.items.reduce((s,t)=>s+(t.dir==="income"?t.amount:-t.amount),0);
        const pd=parseD(g.date);
        return `<div class="dg-head"><span class="dg-day">${pd.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</span><span class="dg-total">${rupees(dayTotal)}</span></div>`+
          g.items.map(t=>this.txRow(t)).join("");
      }).join(""):`<div class="empty"><div>${IC.empty}</div><div class="t">No transactions</div><div class="s">Nothing matches your filters yet</div></div>`}
    </div>`;
  },
  txRow(t,mini){
    const c=catById(t.categoryId),a=accById(t.accountId);
    return `<button class="trow" data-act="open-txn" data-id="${t.id}">
      <span class="ccircle small" style="--c:${c.color}">${init(c.name)}</span>
      <span class="trow-body">
        <span class="tname">${esc(t.name||c.name)}</span>
        <span class="tsub">${esc(c.name)} · ${esc(a?a.name:"")}${t.note?' · '+esc(t.note):""}</span>
      </span>
      <span class="tamt ${t.dir==="income"?"inc":""}">${t.dir==="income"?"+":"−"}${rupees(t.amount)}</span>
    </button>`;
  },

  /* ============ BUDGETS ============ */
  budgets(){
    const bs=this.data.budgets,st=this.monthStats(this.mkey),mk=parseMk(this.mkey);
    const title=mk.toLocaleDateString("en-IN",{month:"long"});
    return `
    <div class="scr">

      ${bs.length?`<div class="card"><div class="card-title">${esc(title)} spent</div><div class="brow"><span class="ccircle" style="--c:#F5F5F5">${init("All")}</span><span class="bname">Total spending</span><span class="bamt">${rupees(st.spent)}</span></div></div>`:""}
      ${bs.length?bs.map(b=>{
        const spent=this.budgetSpent(b),pct=spent/b.limit,over=spent>b.limit;
        return `<div class="card" data-act="bud-open" data-id="${b.id}" role="button">
          <div class="bud-top">
            <span class="ccircle" style="--c:${b.color}">${init(b.name)}</span>
            <span class="bname-h">${esc(b.name)}</span>
            <span style="color:var(--muted);font-size:13px">${over?"Over":""} ${Math.round(pct*100)}%</span>
          </div>
          <div class="progress ${over?"over":""}"><i style="width:${Math.min(100,Math.round(pct*100))}%"></i></div>
          <div class="bud-meta"><span><b>${rupees(spent)}</b> of ${rupees(b.limit)}</span><span class="${over?"neg":""}">${over?("Over by "+rupees(spent-b.limit)):("Left "+rupees(b.limit-spent))}</span></div>
        </div>`;
      }).join(""):
      `<div class="card"><div class="empty"><div>${IC.target}</div><div class="t">No budgets yet</div><div class="s">Set a monthly budget to track spending per category</div></div></div>`}
    </div>`;
  },

  settings(){

  /* ---------- sheet plumbing ---------- */
  openSheet(html){
    $("#sheet").innerHTML=`<div class="sheet" id="sheet-body">${html}</div>`;
    $("#scrim").classList.add("on");
    requestAnimationFrame(()=>requestAnimationFrame(()=>$("#sheet-body").classList.add("up")));
  },
  swapSheet(html){
    $("#sheet-body").innerHTML=html;
    $("#sheet-body").scrollTop=0;
  },
  closeSheet(){
    const sb=$("#sheet-body");
    if(!sb){$("#scrim").classList.remove("on");return}
    sb.classList.remove("up");
    $("#scrim").classList.remove("on");
    this.pendingDel=null;
    setTimeout(()=>{$("#sheet").innerHTML=""},320);
  },

  /* ---------- input handlers ---------- */
  onSearch(v){this.flt.q=v;this.render()},
  setMsd(v){this.data.settings.monthStartDay=parseInt(v,10);this.save();this.toast("Month starts on day "+v)},

  key(k){
    const a=this.add;
    if(k==="del"){a.amount=a.amount.slice(0,-1)}
    else if(k==="."){
      if(!a.amount)a.amount="0.";
      else if(!a.amount.includes("."))a.amount+=".";
    }
    else{
      if(a.amount.includes(".")&&a.amount.split(".")[1].length>=2)return;
      if(a.amount==="0")a.amount=k;
      else a.amount+=k;
      if(a.amount.length>10)return;
    }
    this.render();
  },

  /* ---------- actions ---------- */
  actions:{
    tab:(el)=>{
      const t=el.dataset.tab;
      if(t==="add"){App.prevView=App.view;App.add=App.freshAdd()}
      App.view=t;App.render();
      if(t!=="add")App.prevView=t;
    },
    "close-add":()=>{App.view=App.prevView;App.render()},
    "close-sheet":()=>App.closeSheet(),
    "dp-open":()=>{const d=parseD(App.add.date);App.dp={y:d.getFullYear(),m:d.getMonth()};App.openSheet(App.dpSheet())},
    "dp-prev":()=>{App.dp.m--;if(App.dp.m<0){App.dp.m=11;App.dp.y--}App.swapSheet(App.dpSheet())},
    "dp-next":()=>{App.dp.m++;if(App.dp.m>11){App.dp.m=0;App.dp.y++}App.swapSheet(App.dpSheet())},
    "dp-today":()=>{const d=new Date();App.dp={y:d.getFullYear(),m:d.getMonth()};App.swapSheet(App.dpSheet())},
    "dp-pick":(el)=>{App.add.date=el.dataset.date;App.closeSheet();App.render()},
    "cat-open":()=>App.openSheet(App.catSheet()),
    "dp-pickcat":(el)=>{App.add.categoryId=el.dataset.id;App.closeSheet();App.render()},
    "acc-open-pick":()=>App.openSheet(App.accSheet()),
    "pick-acc":(el)=>{App.add.accountId=el.dataset.id;App.closeSheet();App.render()},
    "note-open":()=>App.openSheet(App.noteSheet()),
    "note-save":()=>{const v=$("#nt").value.trim();App.add.note=v;App.closeSheet();App.render()},
    "seg-dir":(el)=>{
      const d=el.dataset.d||(App.add.dir==="expense"?"income":"expense");
      App.add.dir=d;App.closeSheet();App.render();
    },
    "key":(el)=>App.key(el.dataset.k),
    "add-save":()=>{
      const a=App.add,v=parseFloat(a.amount);
      if(!isFinite(v)||v<=0){App.toast("Enter an amount");return}
      const txn={id:uid(),date:a.date,dir:a.dir,amount:Math.round(v*100),
        categoryId:a.categoryId,accountId:a.accountId,name:"",note:a.note,createdAt:Date.now()};
      App.data.transactions.push(txn);
      App.save();App.add=App.freshAdd();App.view=App.prevView;App.render();
      App.toast("Added "+rupees(txn.amount));
    },
    "add-more":()=>App.openSheet(App.moreSheet()),
    "repeat-last":()=>{
      const t=App.sortedTxs()[0];
      if(!t){App.toast("No previous transaction");return}
      App.add.amount=String(t.amount/100).replace(/\.0+$/,"");
      App.add.dir=t.dir;App.add.categoryId=t.categoryId;App.add.accountId=t.accountId;
      App.render();App.toast("Repeated last "+(t.name||catById(t.categoryId).name));
    },
    "shortcuts":()=>App.openSheet(App.shortcutsSheet()),
    "short-save":()=>{
      const a=App.add;
      App.data.shortcuts.push({id:uid(),name:a.note||"Shortcut",dir:a.dir,amount:a.amount,
        categoryId:a.categoryId,accountId:a.accountId});
      App.save();App.closeSheet();App.toast("Shortcut saved");
    },
    "short-pick":(el)=>{
      const sh=App.data.shortcuts.find(x=>x.id===el.dataset.id);if(!sh)return;
      App.add.amount=sh.amount;App.add.dir=sh.dir||App.add.dir;
      if(sh.categoryId)App.add.categoryId=sh.categoryId;
      if(sh.accountId)App.add.accountId=sh.accountId;
      if(sh.name&&sh.name!=="Shortcut")App.add.note=sh.name;
      App.closeSheet();App.render();
    },
    "short-del":(el)=>{
      App.data.shortcuts=App.data.shortcuts.filter(x=>x.id!==el.dataset.id);
      App.save();App.swapSheet(App.shortcutsSheet());
    },
    "month-prev":()=>{const d=parseMk(App.mkey);d.setMonth(d.getMonth()-1);App.mkey=monthKey(d);App.render()},
    "month-next":()=>{const d=parseMk(App.mkey);d.setMonth(d.getMonth()+1);App.mkey=monthKey(d);App.render()},
    "go-activity":()=>{App.flt.cat="all";App.view="activity";App.prevView="activity";App.render()},
    "go-settings":()=>{App.view="settings";App.render()},
    "ov-cat":(el)=>{App.flt.cat=el.dataset.id;App.view="activity";App.render()},
    "fd":(el)=>{App.flt[el.dataset.f]=el.dataset.v;App.render()},
    "open-txn":(el)=>{App.txOpen=el.dataset.id;App.pendingDel=null;App.openSheet(App.txnSheet(el.dataset.id))},
    "txn-edit":()=>{const t=App.data.transactions.find(x=>x.id===App.txOpen);if(!t)return;
      App.add={amount:String(t.amount/100).replace(/\.0+$/,""),dir:t.dir,categoryId:t.categoryId,accountId:t.accountId,date:t.date,note:t.note};
      App.closeSheet();App.view="add";App.prevView="activity";App.render();},
    "txn-del":(el)=>{
      const id=el.dataset.id;
      if(App.pendingDel!==id){App.pendingDel=id;App.swapSheet(App.txnSheet(id));return}
      App.data.transactions=App.data.transactions.filter(x=>x.id!==id);
      App.save();App.closeSheet();App.render();App.toast("Deleted");
    },
    "t-hide":()=>{App.data.settings.hideBalances=!App.data.settings.hideBalances;App.save();App.render()},
    "cat-manage":()=>App.openSheet(App.catManageSheet()),
    "cat-del":(el)=>{App.data.categories=App.data.categories.filter(c=>c.id!==el.dataset.id);
      App.data.transactions.forEach(t=>{if(t.categoryId===el.dataset.id)t.categoryId="cat-o"});App.save();App.swapSheet(App.catManageSheet())},
    "cc-kind":(el)=>{App._ccKind=App._ccKind==="expense"?"income":"expense";el.textContent=App._ccKind==="expense"?"Expense":"Income"},
    "cc-col":(el)=>{App._ccCol=el.dataset.col;
      document.querySelectorAll("[data-act=cc-col]").forEach((b,i)=>b.classList.toggle("on",i===parseInt(el.dataset.i,10)))},
    "cc-add":()=>{
      const n=($("#cc-n").value||"").trim();
      if(!n){App.toast("Enter a name");return}
      if(App.data.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){App.toast("Already exists");return}
      App.data.categories.push({id:"cat-u-"+uid(),name:n,kind:App._ccKind||"expense",color:App._ccCol||"#777B7E"});
      App.save();App.swapSheet(App.catManageSheet());
    },
    "bud-add":()=>App.openSheet(App.budSheet()),
    "bb-cat":(el)=>{
      const id=el.dataset.id;
      App.budSet.has(id)?App.budSet.delete(id):App.budSet.add(id);
      App.renderDet(); },
    "bb-all":()=>{App.budSet.clear();App.renderDet()},
    "bud-save":(el)=>{
      const name=($("#bb-n").value||"").trim()||"Budget";
      const lim=parseFloat($("#bb-l").value||"0");
      if(!isFinite(lim)||lim<=0){App.toast("Enter a limit");return}
      const id=el.dataset.id;
      const data={name,limit:Math.round(lim*100),categoryIds:Array.from(App.budSet),color:"#7C9AA6"};
      if(id){const b=App.data.budgets.find(x=>x.id===id);Object.assign(b,data)}
      else{App.data.budgets.push(Object.assign({id:uid()},data))}
      App.save();App.closeSheet();App.render();App.toast(id?"Budget updated":"Budget created");
    },
    "bud-open":(el)=>App.openSheet(App.budSheet(el.dataset.id)),
    "acc-add":()=>App.openSheet(App.accAddSheet()),
    "pwa-help":()=>App.openSheet(`
      <div class="sh-grab"></div>
      <div class="sh-title">Run locally, no server</div>
      <div class="tsub" style="margin:0 2px 8px">1 · In Safari, tap Share ${IC.share}</div>
      <div class="tsub" style="margin:0 2px 8px">2 · Tap <b>Add to Home Screen</b> (Add to Dock on iPadOS)</div>
      <div class="tsub" style="margin:0 2px 8px">3 · Open Xpend from your Home Screen — it runs offline with all data stored on the phone</div>
      <div class="tsub" style="margin:0 2px 10px;color:var(--muted)">The installed app keeps its secure https origin, so gist backup keeps working with no server needed.</div>`),
    "aa-kind":(el)=>{
      App._accKind=el.dataset.k;
      ["cash","card","savings"].forEach(k=>{const b=$("#aakind-"+k);if(b)b.classList.toggle("on",k===el.dataset.k)})},
    "acc-add-save":()=>{
      const n=($("#aa-n").value||"").trim();
      if(!n){App.toast("Enter a name");return}
      const o=parseFloat($("#aa-o").value||"0")||0;
      App.data.accounts.push({id:"acc-u-"+uid(),name:n,kind:App._accKind||"cash",opening:Math.round(o*100),color:"#7C9AA6"});
      App.save();App.closeSheet();App.render();App.toast("Account created");
    },
    "acc-open":(el)=>App.openSheet(App.accRenameSheet(el.dataset.id)),
    "acc-rename-save":()=>{
      const n=($("#aa-n").value||"").trim();
      if(!n){App.toast("Enter a name");return}
      const a=accById(App._accId);if(!a)return;
      a.name=n;App.save();App.closeSheet();App.render();App.toast("Account renamed");
    },
    "gb-setup":()=>App.openSheet(App.gbSetupSheet()),
    "gb-setup-save":async()=>{
      const pass=$("#gb-pass").value,pat=$("#gb-pat").value.trim();
      if(pass.length<8){App.toast("Passphrase must be at least 8 characters");return}
      if(!pat||pat.length<10){App.toast("Enter a GitHub token with gist scope");return}
      if(pat.startsWith("github_pat_")){App.toast("Fine-grained tokens don't support gist scope — use a classic token (ghp_…)");return}
      if(!C.sup()){App.toast("Backup needs a secure connection — open Xpend over https://");return}
      App.closeSheet();
      try{
        const r=await Gist.connect(pass,pat);
        App.add=App.freshAdd();App.render();
        App.toast(r.restored?("Restored backup · "+r.gistId.slice(0,7)):"Backup connected");
      }catch(e){
        if(e&&e.name==="OperationError")App.toast("Wrong passphrase or corrupt backup");
        else App.toast("Setup failed: "+(e&&e.name?e.name+": ":"")+(e&&e.message||e));
        App.render();
      }
    },
    "gb-unlock":()=>App.openSheet(App.gbUnlockSheet()),
    "gb-unlock-save":async()=>{
      const pass=$("#gb-pass").value;
      if(!pass){App.toast("Enter your passphrase");return}
      if(!C.sup()){App.toast("Backup needs a secure connection — open Xpend over https://");return}
      App.closeSheet();
      try{
        const pulled=await Gist.unlock(pass);
        App.render();App.toast(pulled?"Synced latest backup":"Backup unlocked");
      }catch(e){App.toast("Wrong passphrase");App.render()}
    },
    "gb-push":async()=>{
      if(!Gist.unlocked()){App.openSheet(App.gbUnlockSheet());return}
      try{
        await Gist.push(true);
        App.render();App.toast("Backed up to gist");
      }catch(e){App.toast("Backup failed: "+(e&&e.message||e))}
    },
    "gb-restore":()=>App.openSheet(App.gbRestoreSheet()),
    "gb-restore-save":async()=>{
      const pass=$("#gb-pass").value,gid=($("#gb-gid").value||"").trim();
      if(!pass){App.toast("Enter your passphrase");return}
      if(!C.sup()){App.toast("Backup needs a secure connection — open Xpend over https://");return}
      App.closeSheet();
      try{
        await Gist.restore(pass,gid);
        App.add=App.freshAdd();App.render();App.toast("Restored from backup");
      }catch(e){
        if(e&&e.name==="OperationError")App.toast("Wrong passphrase or corrupt backup");
        else App.toast("Restore failed: "+(e&&e.message||e));
      }
    },
    "gb-disconnect":()=>{
      if(!confirm("Stop using this gist for backup?"))return;
      Gist.disconnect();App.render();App.toast("Backup disconnected");
    },
    "sample-load":()=>{
      if(App.data.transactions.length){if(!confirm("Replace existing data with sample?"))return}
      sampleData();
      App.render();App.toast("Sample data loaded");
    },
    "reset-all":()=>{
      if(!confirm("Erase all data and restore defaults?"))return;
      Gist.disconnect();App.data=defaultDoc();App.save();App.add=App.freshAdd();App.mkey=monthKey(new Date());
      App.flt={q:"",dir:"all",cat:"all",acc:"all"};App.render();App.toast("Reset complete");
    }
  }
};

/* sample data */
function sampleData(){
  const today=new Date();
  const D=n=>{const d=new Date(today);d.setDate(d.getDate()-n);return dstr(d)};
  const txs=[
    {date:D(0),dir:"expense",amount:1200,categoryId:"cat-g",accountId:"acc-card",name:"Groceries"},
    {date:D(0),dir:"expense",amount:450,categoryId:"cat-e",accountId:"acc-cash",name:"Coffee & croissant"},
    {date:D(1),dir:"expense",amount:2100,categoryId:"cat-t",accountId:"acc-card",name:"Cab home"},
    {date:D(2),dir:"income",amount:85000,categoryId:"cat-sal",accountId:"acc-card",name:"Salary"},
    {date:D(3),dir:"expense",amount:3450,categoryId:"cat-s",accountId:"acc-card",name:"Sneakers"},
    {date:D(4),dir:"expense",amount:950,categoryId:"cat-h",accountId:"acc-card",name:"Pharmacy"},
    {date:D(5),dir:"expense",amount:1800,categoryId:"cat-en",accountId:"acc-card",name:"Movie night"},
    {date:D(8),dir:"expense",amount:9800,categoryId:"cat-r",accountId:"acc-card",name:"Rent"},
    {date:D(10),dir:"expense",amount:2600,categoryId:"cat-u",accountId:"acc-card",name:"Electricity"},
    {date:D(12),dir:"expense",amount:1400,categoryId:"cat-g",accountId:"acc-cash",name:"Market run"},
    {date:D(15),dir:"expense",amount:4200,categoryId:"cat-tr",accountId:"acc-card",name:"Train tickets"}
  ];
  App.data.transactions=txs.map((t,i)=>Object.assign({id:uid(),note:"",createdAt:Date.now()-i*1e6},t));
  App.data.accounts[0].opening=20000;App.data.accounts[1].opening=45000;
  App.data.budgets=[{id:"bud-1",name:"Groceries",limit:15600,categoryIds:["cat-g"],color:"#7C9AA6"}];
}

/* ============================ GLOBAL CLICK DELEGATION ============================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const fn=App.actions[el.dataset.act];
  if(fn)fn(el,e);
});

document.addEventListener("keydown",e=>{if(e.key==="Escape")App.closeSheet()});

/* flush pending backup when leaving the page */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")Gist.push().catch(()=>{})});

/* renderDet: re-render sheet content pieces handled by App.actions */
App.renderDet=function(){
  const sb=$("#sheet-body");
  if(sb&&sb.querySelector("[data-act=bb-cat]")){
    const cats=App.data.categories.filter(c=>c.kind==="expense");
    const chips=[...sb.querySelectorAll(".chip")];
    chips.forEach((ch,n)=>{
      const first=sb.querySelector("[data-act=bb-all]");
      if(ch===first){ch.classList.toggle("on",App.budSet.size===0)}
      else{
        const idField=ch.dataset.id;
        const c=cats.find(c=>c.id===idField);
        if(c)ch.classList.toggle("on",App.budSet.has(c.id));
      }
    });
  }
};

/* ============================ BOOT ============================ */
window.addEventListener("load",()=>{App.boot()});
window.App=App;
</script>
