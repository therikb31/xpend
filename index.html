<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060809">
<meta name="apple-mobile-web-app-title" content="Xpend">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060809'/%3E%3Cpath d='M20 20l24 24M44 20 20 44' stroke='%23F8F8F8' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Xpend</title>
<style>
/* ============================ DESIGN TOKENS (UI_DESIGN_SPEC.md) ============================ */
:root{
  --bg:#060809;          /* app background */
  --bg-elev:#090B0C;
  --card:#0D1113;        /* faint card lift */
  --surface:#1E252B;     /* sheet surface */
  --surface-2:#171B1E;
  --control:#2B3339;     /* control fill */
  --faint:rgba(255,255,255,.06);
  --text:#F5F5F5;
  --text-2:#B9BEC2;
  --muted:#777B7E;
  --muted-2:#85898C;
  --handle:#60666A;      /* drag handle */
  --sel:#F8F8F8;         /* selected circle */
  --sel-txt:#111111;
  --scrim:rgba(0,0,0,.68);
  --inc:#5BB98C;         /* muted income green */
  --neg:#C05B4D;         /* muted over-budget red */
  --warn:#E2BE54;        /* yellow highlight — transaction missing a merchant */
  --teal:#3A9586;        /* muted accent (star badge) */
  --teal-deep:#12455A;   /* overview hero (upper section) */
  --teal-hi:#164C61;
  --bg-soft:#11171A;     /* overview base / lower section */
  --green:#52E5A5;       /* spending comparison indicator */
  --nav-drk:#121416;     /* floating bottom navigation */
  --nav-act:#34383C;     /* active nav pill */
  --ov-card:#252C30;     /* dashboard expense card */
  --fab-drk:#4B5054;     /* floating microphone button */
  --r-sheet:36px;        /* sheet top radius */
  --r-card:26px;
  --r-pill:999px;
  --tab-h:74px;
  --rail-w:96px;
  --fs: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--fs);
  font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{
  font-family:inherit;color:inherit;background:none;border:0;
  cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{font-family:inherit;color:var(--text)}
svg{display:block}
::-webkit-scrollbar{width:0;height:0}

/* ============================ APP SHELL ============================ */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100svh;height:100dvh;
  background:var(--bg);
}
/* Standalone (home-screen) iOS: pin the app shell to the real screen edges with
   position:fixed + inset:0. This avoids the intermittent iOS bug where 100dvh is
   reported too short right after launch, which left a black strip at the bottom
   until the app was removed from RAM. env() safe-area insets keep the nav, FABs
   and sheets clear of the home indicator. */
@media (display-mode: standalone){
  #app{position:fixed;inset:0;height:auto}
  html,body{height:100%}
}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.scr{padding:calc(6px + env(safe-area-inset-top,0px)) 18px calc(180px + env(safe-area-inset-bottom,0px))}
.scr.ov{padding:0 0 calc(200px + env(safe-area-inset-bottom,0px))}
.scr.pad-nav{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}

/* ============================ NAV (floating pill / desktop rail) ============================ */
#nav{
  z-index:40;
  position:fixed;left:14px;right:14px;
  bottom:8px;
  bottom:max(8px, calc(env(safe-area-inset-bottom,0px) - 22px));
  height:70px;border-radius:35px;
  display:flex;align-items:stretch;padding:5px;gap:1px;
  background:rgba(18,20,22,.94);
  border:.5px solid rgba(255,255,255,.12);
  box-shadow:0 12px 36px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.08) inset;
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;
  border-radius:33px;
}
.nav-item .ni-ic{width:25px;height:25px}
.nav-item span:last-child{font-size:10px;letter-spacing:0;display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:active{background:var(--nav-act)}
.nav-item.on{background:var(--nav-act);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.1) inset}

/* the add-expense screen is an overlay modal — drop the floating nav so it never covers the keypad */
#app.add #nav{display:none}
#app.add{background:var(--bg)}

/* overview upper background glow (static, sits behind scrolling content) */
#app.ov{
  background:
    radial-gradient(132% 58% at 50% -8%,rgba(88,150,176,.5),rgba(36,92,118,.32) 46%,rgba(17,23,26,0) 70%),
    linear-gradient(180deg,var(--teal-hi) 0%,var(--teal-deep) 26%,var(--bg-soft) 66%,#0A0D0F 100%);
}

/* ============================ OVERVIEW DASHBOARD (reference UI) ============================ */
.ov-top{display:flex;justify-content:flex-start;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 0}
.ov-gear{
  width:46px;height:46px;border-radius:50%;
  background:rgba(18,20,22,.32);border:.5px solid rgba(140,170,185,.4);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:#F5F5F5;display:grid;place-items:center;
}
.ov-gear svg{width:22px;height:22px}
.ov-gear:active{background:rgba(18,20,22,.6)}
.ov-sum{display:block;width:100%;text-align:center;padding:10px 20px 2px}
.ov-mon{display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;font-weight:500;color:#9BA6AC}
.ov-mon svg{width:13px;height:13px;color:#9BA6AC}
.ov-total{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
.ov-delta{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;color:var(--green);font-size:13.5px;font-weight:600}
.ov-delta svg{width:16px;height:16px}

.ov-chart{margin:8px 18px 4px}
.chart-plot{position:relative;height:212px}
.chart-plot .bars{position:absolute;left:0;right:40px;top:2px;bottom:0;display:flex;align-items:flex-end;gap:3px;padding:0 2px}
.bar{flex:1;background:rgba(124,146,158,.26);border-radius:4px 4px 2px 2px;height:3%}
.bar.on{background:var(--text)}
.chart-plot .dash{
  position:absolute;left:0;right:36px;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(245,245,245,.6) 0 5px,transparent 5px 9px);
  pointer-events:none;
}
.chart-plot .ref-label{
  position:absolute;right:42px;transform:translateY(-50%);
  font-size:11.5px;font-weight:700;color:#F5F5F5;letter-spacing:.02em;
  background:rgba(18,20,22,.55);padding:2px 7px;border-radius:9px;
  font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;
}
.yax{position:absolute;top:0;right:0;bottom:0;width:36px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:0}
.yax .mid{color:#E9EBED}
.xax{display:flex;justify-content:space-between;padding:9px 36px 0 2px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ============================ CATEGORY DASHBOARD ============================ */
.scr.cat{padding:0 18px calc(200px + env(safe-area-inset-bottom,0px))}
.cat-top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 2px 4px}
.cat-metric{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cat-title{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;color:#9BA6AC;white-space:nowrap}
.cat-title svg{width:13px;height:13px;color:#9BA6AC}
.cat-total{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
.cat-delta{display:flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:600}
.cat-delta svg{width:15px;height:15px}
.cat-delta.neg{color:var(--neg)}
.cat-delta.mute{color:var(--muted);font-weight:500}
.cat-spacer{visibility:hidden}
.cat-chart .bar{background:rgba(255,255,255,.05)}
.cat-chart .bar.on{background:var(--c,#8C52FF)}
/* category screen: edge-to-edge like Activity — neutralize the intrinsic insets of the shared dashboard widgets */
.scr.cat .ov-chart{margin:6px 0 4px}
.scr.cat .ov-chips{padding:8px 0 4px}
.scr.cat .cat-list .dg-head:first-child{padding-top:12px}
.scr.cat .cat-list .empty{padding:40px 0}

/* swipe month-navigation surfaces */
.swipe-mk{
  touch-action:pan-y;
  transition:transform .18s ease;
  will-change:transform;
  -webkit-user-select:none;user-select:none;
}
.donut-wrap.big .donut-center>*{touch-action:pan-y;-webkit-user-select:none;user-select:none}

.ov-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 4px;-webkit-overflow-scrolling:touch;-ms-overflow-style:none}
.ov-chip{
  flex:none;height:38px;padding:0 15px;border-radius:19px;
  background:var(--ov-card);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.ov-chip.circ{width:38px;padding:0;justify-content:center}
.ov-chip.circ svg{width:17px;height:17px}
.ov-chip:active{background:#2D353B}
.ov-chip.on{background:var(--text);color:#11171A}
.ov-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}

/* ============================ SUMMARY (donut-overview, reference UI) ============================ */
.scr.sum{padding:0 0 calc(220px + env(safe-area-inset-bottom,0px))}
.sum-chart{padding:24px 18px 2px}
.donut-wrap.big{width:min(280px,80vw);margin:0 auto;position:relative}
.donut-wrap.big .donut-svg{width:100%;height:auto;display:block}
.donut-wrap.big .donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;
  pointer-events:none;
}
.donut-wrap.big .donut-center>*{pointer-events:auto}
.dc-month{
  display:flex;align-items:center;gap:4px;color:#9BA6AC;
  font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;
}
.dc-month:active{background:rgba(255,255,255,.07)}
.dc-month svg{width:12px;height:12px;color:#9BA6AC}
.donut-wrap.big .dc-main{
  font-size:36px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:#fff;
}
.dc-trend{
  display:inline-flex;align-items:center;gap:4px;margin-top:4px;
  padding:3px 10px;border-radius:99px;
  background:rgba(255,82,82,.15);color:#FF5252;
  font-size:12px;font-weight:600;white-space:nowrap;
}
.dc-trend.up{background:rgba(255,159,67,.15);color:#FF9F43}
.dc-trend.mute{background:rgba(255,255,255,.06);color:var(--muted)}
.sum-list{padding:8px 18px}
.sum-card{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--ov-card);border-radius:20px;padding:11.5px 13px;margin-bottom:10px;
}
.sum-card:active{background:#2D353B}
.sum-ic{
  position:relative;width:52px;height:52px;border-radius:18px;flex:none;
  background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:25px;
}
.sum-ic::after{
  content:"";position:absolute;inset:-3.5px;border-radius:21.5px;
  border:1.5px solid var(--c,#7B61FF);opacity:.42;pointer-events:none;
}
.sum-cc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.sum-cc .nm{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sum-count{background:var(--surface-2);color:var(--text-2);border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:600}
.sums-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.sum-amt{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-pct{background:var(--surface-2);color:var(--muted);border-radius:99px;padding:2.5px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}

.ov-groups{padding:2px 18px}
.ov-mh{font-size:14px;font-weight:600;color:var(--text-2);padding:12px 4px 2px}
.ov-mh:not(:first-child){margin-top:8px}
.ov-day{
  background:var(--ov-card);border-radius:20px;
  padding:7px 7px;overflow:hidden;margin-bottom:15px;
}
.ov-dg{display:flex;justify-content:space-between;align-items:baseline;padding:10px 11px 6px}
.ov-dg-day{color:var(--muted);font-size:13px;font-weight:500}
.ov-dg-amt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ov-card{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border-radius:12px;padding:6px 10px;margin-bottom:0;
}
.ov-card:active{background:rgba(255,255,255,.06)}
.ov-card + .ov-card{border-top:.5px solid rgba(255,255,255,.07)}
.ov-ic{width:28px;height:22px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:13px;line-height:1;flex:none}
.ov-cc{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.ov-cc .nm{color:var(--text);font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-cc .sb{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-card .amt{font-size:16.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ov-card .amt.sm{font-size:13px;font-weight:500;color:var(--muted)}
  .ov-card .amt.sm.inc{color:var(--inc);font-weight:600}
  .ov-card .amt.sm.nom{color:var(--warn);font-weight:600}
  .ov-card .amt.inc{color:var(--inc)}
.ov-card .amt.sav{color:var(--neg)}
.see-all{display:block;text-align:center;padding:12px 0 4px;color:var(--muted);font-size:14.5px;font-weight:600}
.see-all:active{color:var(--text)}

/* floating action buttons (+ mic, + add) */
.fab-stack{
  position:fixed;right:20px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:45;
  display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:none;
}
.fab{pointer-events:auto;display:grid;place-items:center;border-radius:50%;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.fab:active{transform:scale(.96)}
.fab.add{width:64px;height:64px;background:var(--text);color:#11171A;border:.5px solid rgba(0,0,0,.5)}
.fab.add svg{width:30px;height:30px;stroke-width:3}

/* month picker sheet */
.mk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 0 6px}
.mk-cell{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0;
  border-radius:16px;background:var(--surface-2);color:var(--text-2);
}
.mk-cell .mk-n{font-size:15px;font-weight:600}
.mk-cell .mk-y{font-size:11.5px;color:var(--muted)}
.mk-cell.on{background:var(--text);color:#11171A}
.mk-cell.on .mk-y{color:rgba(17,23,26,.6)}

/* analytics rows */
.an-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.an-n{flex:0 0 34px;font-size:13px;color:var(--muted);font-weight:500}
.an-track{flex:1;height:14px;border-radius:7px;background:var(--control);overflow:hidden}
.an-track i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--teal),#6FB2C8);min-width:3px}
.an-v{flex:0 0 52px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

/* ============================ HEADERS ============================ */
.scrhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-size:30px;font-weight:700;letter-spacing:-.02em}
.cbtn{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--control);color:#DFE3E6;
  display:grid;place-items:center;
}
.cbtn svg{width:20px;height:20px}
.cbtn.small{width:34px;height:34px}
.cbtn.small svg{width:17px;height:17px}
.cbtn:active{background:#393f46}

/* segmented control */
.seg{
  display:flex;background:var(--control);border-radius:var(--r-pill);
  padding:3px;gap:2px;
}
.seg button{
  padding:7px 14px;border-radius:var(--r-pill);
  font-size:13px;font-weight:600;color:var(--muted-2);letter-spacing:.01em;
}
.seg button.on{background:var(--surface-2);color:var(--text)}

/* ============================ CARDS & ROWS ============================ */
.card{
  background:var(--card);border-radius:var(--r-card);
  padding:18px;margin-bottom:14px;
}
.card-title{
  font-size:13px;font-weight:600;color:var(--muted-2);
  text-transform:uppercase;letter-spacing:.09em;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.card-title .link{color:var(--text-2);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}

.ccircle{
  --c:#777B7E;
  width:34px;height:34px;border-radius:50%;flex:none;
  background:var(--c);color:#0B0B0C;
  display:grid;place-items:center;
  font-size:16px;font-weight:700;
}
.ccircle.lg{width:46px;height:46px;font-size:20px}
.ccircle.small{width:24px;height:24px;font-size:12.5px}
.ccircle svg{width:17px;height:17px;color:#D6DADD}
.ccircle.pic{background:#fff}
.ccircle .acc-ico{width:66%;height:66%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.sum-ic .acc-ico{width:30px;height:30px;object-fit:contain;display:block;pointer-events:none}
.cat-title .acc-ico{width:20px;height:20px;object-fit:contain;display:inline-block;pointer-events:none}
.mi-url-box{display:flex;align-items:center;gap:10px;margin-top:8px}
.mi-url-prev{width:44px;height:44px;border-radius:14px;background:var(--control);display:grid;place-items:center;flex:none;overflow:hidden;border:.5px solid rgba(255,255,255,.08)}
.mi-url-prev .acc-ico{width:100%;height:100%;object-fit:contain}
.mi-url-ph{font-size:12px;color:var(--muted-2);font-weight:600}
.mi-url-box input[type=text]{flex:1;background:var(--control);border:0;border-radius:14px;padding:12px 14px;font-size:14px;color:var(--text);outline:0}
.mi-url-box input[type=text]::placeholder{color:var(--muted-2)}
.mi-url-box input[type=text]:focus{box-shadow:inset 0 0 0 1px var(--sel)}
.btn:disabled{opacity:.45;pointer-events:none}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.ai-cell{background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ai-cell .ccircle{width:42px;height:42px}
.ai-cell .acc-ico{width:70%;height:70%}
.ai-cell.on{background:var(--text);border-color:var(--text)}
.ai-cell.on .ai-name{color:var(--bg)}
.ai-name{font-size:11.5px;color:var(--muted-2);text-align:center;line-height:1.25}
.csel{display:inline-flex;align-items:center}

/* amount */
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.amt.inc{color:var(--inc)}
.amt.sav{color:var(--neg)}
.amt.neg{color:var(--neg)}
.amt.dim{color:var(--muted)}

/* ============================ DONUT ============================ */
.donut-wrap{position:relative;width:min(230px,62vw);margin:6px auto 4px}
.donut-wrap > svg{width:100%;height:auto;display:block}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-align:center;
}
.dc-main{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dc-sub{font-size:13px;color:var(--muted)}
.donut-foot{
  display:flex;justify-content:space-between;margin-top:14px;
  padding-top:14px;border-top:.5px solid rgba(255,255,255,.07);
  font-size:14px;color:var(--text-2);
}
.donut-foot b{color:var(--text);font-weight:700}
.remain-row{display:flex;justify-content:space-between;margin-top:12px;font-size:14.5px}

/* breakdown rows */
.brow{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:10px 2px;text-align:left;border-radius:14px;
}
.brow:active{background:var(--faint)}
.brow .bname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
.brow .bpct{font-size:13px;color:var(--muted);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.brow .bamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* transaction rows */
.trow{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:2px;text-align:left;border-radius:12px;
}
.trow:active{background:var(--faint)}
.trow-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:0px}
.temoji{width:22px;height:22px;display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.tname{font-size:14.5px;font-weight:500}
.tsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tamt.inc{color:var(--inc)}
.tamt.sav{color:var(--neg)}
  .tamt.nom{color:var(--warn)}
  .mute{color:var(--muted)!important}
  .trow .tamt{font-size:13px;font-weight:500;color:var(--muted)}
  .trow .tamt.inc{color:var(--inc);font-weight:600}
  .trow .tamt.nom{color:var(--warn);font-weight:600}

/* txn detail sheet */
.txn-row{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.txn-row .txn-meta{flex:1;min-width:0}
.txn-row .txn-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-row .txn-sub{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-row .txn-amt{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.txn-row .txn-amt.inc{color:var(--inc)}

/* day group headers */
.dg-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 2px 4px;font-size:12.5px;
}
.dg-day{font-weight:600;color:var(--text-2);text-transform:capitalize}
.dg-total{color:var(--muted);font-variant-numeric:tabular-nums}

/* ============================ CHIPS & SEARCH ============================ */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.chip{
  flex:none;padding:8px 16px;border-radius:var(--r-pill);
  background:var(--control);color:var(--muted-2);font-size:13.5px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.on{background:var(--text);color:var(--bg)}
.chip.on .dot{background:var(--bg)}
.search{
  display:flex;align-items:center;gap:10px;
  background:var(--control);border-radius:16px;padding:0 14px;height:46px;margin-bottom:6px;
  overflow:hidden;
}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;height:100%;margin:0 !important;padding:0 !important;width:0;background:none;border:0;outline:0;font-size:15.5px;line-height:normal;color:var(--text)}
.search input::placeholder{color:var(--muted)}

/* ============================ SETTINGS ROWS / TOGGLES ============================ */
.set{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left}
.set .s-label{flex:1;font-size:15.5px}
.set .s-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.set:active{background:var(--faint)}
.set > svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.set.gh{color:inherit;text-decoration:none}
.switch{width:50px;height:30px;border-radius:99px;background:var(--control);position:relative;flex:none;transition:background .2s}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#8B9094;transition:.2s;
}
.switch.on{background:var(--control)}
.switch.on::after{background:var(--sel);transform:translateX(20px)}
select.sel{
  background:var(--control);border:0;color:var(--text);border-radius:12px;
  padding:10px 34px 10px 14px;font-size:14.5px;font-weight:600;outline:0;
  -webkit-appearance:none;appearance:none;
}
.slab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.slab+ .slab{border-top:.5px solid rgba(255,255,255,.06)}
.sec-label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 2px 6px}

/* ============================ BUTTONS ============================ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  height:56px;border-radius:var(--r-pill);
  background:var(--sel);color:var(--sel-txt);
  font-size:16.5px;font-weight:700;
}
.btn svg{width:21px;height:21px}
.btn.ghost{background:var(--control);color:var(--text)}
.btn.mini{height:44px;font-size:14.5px;padding:0 18px;width:auto}
.btn.danger{background:rgba(192,91,77,.13);color:var(--neg)}
.btn.disabled{opacity:.35;pointer-events:none}

/* ============================ BOTTOM SHEET (spec-faithful) ============================ */
#scrim{
  position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;pointer-events:none}
.sheet{
  pointer-events:auto;
  width:100%;max-width:460px;
  background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 22px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  max-height:88svh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
}
.sheet.up{transform:translateY(0)}
.sh-grab{width:48px;height:5px;border-radius:99px;background:var(--handle);margin:10px auto 8px;flex:none}
.sh-title{font-size:20px;font-weight:700;padding:8px 2px 12px;letter-spacing:-.01em}
.sh-row{
  display:flex;align-items:center;gap:13px;width:100%;padding:13px 4px;text-align:left;border-radius:14px;
}
.sh-row:active{background:var(--faint)}
.sh-row .rname{flex:1;font-size:15.5px}
.sh-row .rbal{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sh-row > svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.sh-row.sel .rname{font-weight:700}

/* ---- date picker (spec §12) ---- */
.dp-head{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
.dp-title{font-size:21px;font-weight:700;margin-right:auto;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{
  text-align:center;font-size:12.5px;font-weight:600;color:var(--muted-2);
  padding-bottom:8px;
}
.cal-day{
  position:relative;aspect-ratio:1;display:grid;place-items:center;
  font-size:16px;color:#F0F0F0;border-radius:50%;
}
.cal-day:active{background:var(--faint)}
.cal-day.sel{background:var(--sel);color:var(--sel-txt);font-weight:700}
.cal-day.today::after{
  content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--teal);
}
.cal-day.sel.today::after{background:var(--sel-txt)}
.cal-grid i{aspect-ratio:1}

/* ---- category picker ---- */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat-chip{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:16px;
  border:1.5px solid var(--c);
  border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:rgba(255,255,255,.04);transition:transform .12s,box-shadow .15s}
.cat-chip:active{transform:scale(.97)}
.cat-chip .cemoji{width:36px;height:36px;flex:none;border-radius:10px;
  display:grid;place-items:center;font-size:18px;line-height:1;
  background:rgba(255,255,255,.07)}
.cat-chip .cname{font-size:13.5px;color:var(--text);font-weight:500;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.04));
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--c) 30%,transparent)}

/* ============================ ADD-EXPENSE SCREEN (spec §26-30) ============================ */
#app.add #screen{overflow:hidden}
#app.add .scr.pad-nav{height:100%;min-height:0}
.add-top{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.add-top-col{display:flex;gap:12px;align-items:center}
.starbtn{position:relative}
.star-badge{
  position:absolute;top:-2px;right:-2px;width:19px;height:19px;border-radius:50%;
  background:var(--teal);color:#06120F;display:grid;place-items:center;
}
.star-badge svg{width:11px;height:11px}
.add-amount{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:10px 0 2px;min-height:54px;flex:none;
}
.add-amount .cur{font-size:.42em;font-weight:700;color:var(--muted-2);margin-top:.34em}
.add-amount .num{
  font-size:clamp(52px,18vw,76px);font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.add-amount .num.small{font-size:clamp(40px,13vw,58px)}
.close-cap{
  align-self:center;margin-left:14px;
  width:40px;height:40px;border-radius:var(--r-pill);
  background:var(--control);color:#DFE3E6;display:grid;place-items:center;flex:none;
}
.close-cap svg{width:18px;height:18px}
.add-fields{display:flex;flex-direction:column;margin:2px 0 8px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.field{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:11px 4px;text-align:left;flex:none;
}
.field+.field{border-top:.5px solid rgba(255,255,255,.06)}
.field .f-name{flex:1;font-size:16px}
.field .f-name.mute{color:var(--muted-2)}
.field .f-val{color:var(--muted-2);font-size:15px;font-variant-numeric:tabular-nums}
.note-field{flex:1;min-width:0;overflow:hidden}
.note-inline{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  font-size:16px;color:var(--text);padding:2px 0;
}
.note-inline::placeholder{color:var(--muted-2)}
.ficon{
  width:40px;height:40px;border-radius:13px;flex:none;
  display:grid;place-items:center;
  background:rgba(255,255,255,.06);
  border:.5px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 4px 14px rgba(0,0,0,.12);
  font-size:18px;line-height:1;color:var(--text);
}
.ficon svg{width:18px;height:18px;color:var(--text-2)}
.field > svg{width:18px;height:18px;color:var(--muted)}
.note-sug{
  display:none;position:fixed;left:18px;right:18px;z-index:70;
  bottom:calc(244px + env(safe-area-inset-bottom,0px));
  background:rgba(20,23,25,.92);
  border:.5px solid rgba(255,255,255,.12);
  border-radius:14px;overflow:hidden;
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.note-sug.show{display:block}
.note-sug-item{
  display:block;width:100%;text-align:left;padding:11px 14px;
  font-size:14.5px;color:var(--text);background:transparent;border:0;border-top:.5px solid rgba(255,255,255,.07);
}
.note-sug-item:first-child{border-top:0}
.note-sug-item b{color:var(--teal,#4AA8A0);font-weight:700}
.note-sug-item:active{background:rgba(255,255,255,.07)}
.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:2px 0 6px;flex:none;
}
.kbtn{
  height:46px;border-radius:20px;background:var(--card);
  color:var(--text);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
}
.kbtn:active{background:var(--control)}
.kbtn svg{width:26px;height:26px;color:var(--text-2)}
.kbtn.tick{background:var(--sel);color:var(--sel-txt)}
.kbtn.tick svg{width:28px;height:28px;color:var(--sel-txt)}
.rate-note{text-align:center;font-size:12.5px;color:var(--muted);padding-bottom:4px}
@media (max-height:720px){
  #app.add .add-top{padding:0}
  #app.add .add-amount{min-height:44px;padding:6px 0 0}
  #app.add .add-amount .num{font-size:clamp(40px,15vw,58px)}
  #app.add .field{padding:9px 4px}
  #app.add .ficon{width:36px;height:36px;font-size:16px;border-radius:11px}
  #app.add .keypad{gap:6px;padding:0 0 2px}
  #app.add .kbtn{height:42px;border-radius:18px;font-size:20px}
}

/* ============================ TOAST ============================ */
#toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:90;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--surface);color:var(--text);
  padding:12px 22px;border-radius:var(--r-pill);
  font-size:14.5px;font-weight:600;letter-spacing:.01em;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:.5px solid rgba(255,255,255,.09);
  transition:.25s ease;white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ============================ EMPTY STATES ============================ */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;margin:0 auto 14px;opacity:.5}
.empty .t{font-size:16px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.empty .s{font-size:13.5px}

.progress{height:9px;border-radius:99px;background:var(--control);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--text)}
.progress.over i{background:var(--neg)}

/* budget card bits */
.bud-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bud-top .bname-h{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--muted)}
.bud-meta b{color:var(--text);font-variant-numeric:tabular-nums}
.sav-line{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--muted)}
.sav-line b{color:var(--text);font-variant-numeric:tabular-nums}
.sav-mv{width:100%;margin-top:10px;padding:8px;border:.5px solid rgba(255,255,255,.12);border-radius:12px;text-align:center;color:var(--inc);font-size:13.5px;background:transparent;cursor:pointer;touch-action:manipulation}
.sav-mv:active{background:rgba(255,255,255,.06)}

/* ============================ GOALS ============================ */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.2px;white-space:nowrap;background:var(--control);color:var(--muted)}
.pill.on{background:rgba(82,229,165,.13);color:#52E5A5}
.pill.warn{background:rgba(255,159,67,.14);color:#FF9F43}
.pill.err{background:rgba(255,90,90,.14);color:#FF5A5A}
.pill.ok{background:rgba(82,229,165,.13);color:#52E5A5}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:12px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric-val{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.metric-val small{font-size:11px;color:var(--muted);font-weight:600}
.metric-val.inc{color:var(--inc)}
.metric-val.neg{color:var(--neg)}
.metric-lbl{font-size:12px;color:var(--muted)}
.status-pills{display:flex;flex-wrap:wrap;gap:6px}
.goal-row{display:flex;flex-direction:column;gap:0;cursor:pointer;touch-action:manipulation}
.goal-row:active{background:rgba(255,255,255,.05)}
.goal-head{display:flex;align-items:center;gap:11px}
.goal-head .ccircle{flex:none}
.goal-name{font-size:16.5px;font-weight:700;color:var(--text)}
.goal-head .goal-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-pbar{display:flex;align-items:center;gap:10px;margin-top:14px}
.goal-pbar-track{flex:1;height:10px;border-radius:99px;background:var(--control);overflow:hidden}
.goal-pbar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8C52FF,#B666FF)}
.goal-pbar.err .goal-pbar-track i{background:var(--neg)}
.goal-pct{font-size:12.5px;font-weight:700;color:var(--muted-2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.goal-fig{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.goal-saved{font-size:18px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.goal-of{font-size:13px;color:var(--muted)}
.goal-foot{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.gchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--control);color:var(--text-2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.gchip svg{width:14px;height:14px;color:var(--muted-2);flex:none}
.gchip.ok{background:rgba(82,229,165,.13);color:#52E5A5}
.gchip.ok svg{color:#52E5A5}
.gchip.warn{background:rgba(255,159,67,.14);color:#FF9F43}
.gchip.warn svg{color:#FF9F43}
.gchip.err{background:rgba(255,90,90,.14);color:#FF5A5A}
.gchip.err svg{color:#FF5A5A}
.goal-calc{background:var(--control);border-radius:16px;padding:14px;margin-bottom:14px}
.goal-calc-hdr{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;margin-bottom:10px}
.gc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc-grid>div{display:flex;flex-direction:column;gap:1px}
.gc-lbl{font-size:11.5px;color:var(--muted)}
.gc-val{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.gc-val.inc{color:var(--inc)}
.gc-val.neg{color:var(--neg)}
.gc-note{margin-top:10px;font-size:13px;color:var(--muted)}
.gc-note b{color:var(--text)}
.gc-note.err{color:var(--neg)}
.gc-note.err b{color:var(--neg)}
.gc-note.ok{color:var(--inc)}
.gd-status{display:flex;gap:8px;margin:2px 0 12px}
.gd-progress{height:10px;border-radius:99px;background:var(--control);overflow:hidden;margin-bottom:14px}
.gd-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8C52FF,#B666FF)}
.gd-note{margin:12px 2px 0;font-size:13.5px;color:var(--muted)}
.gd-note b{color:var(--text)}
.gd-note.ok{color:var(--inc)}
.row-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:8px;background:var(--control);color:var(--muted);cursor:pointer}
.row-btn svg{width:15px;height:15px}

/* ============================ BUDGET (linear pace) ============================ */
.bud-spark{width:100%;height:auto;display:block;margin-top:12px}
.bud-pace-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.bud-pace-txt{font-size:12.5px;color:var(--muted);font-weight:600}
.bud-chax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-2);margin-top:6px;font-variant-numeric:tabular-nums;padding:0 6px}
.bud-strip{margin-top:14px;padding:13px 16px;border-radius:16px;background:rgba(255,159,67,.10);color:#FF9F43;font-size:13.5px;font-weight:600}
.gc-note.warn{color:#FF9F43}
.gc-note.warn b{color:#FF9F43}

/* note text */
.note-ico{font-size:15px;color:var(--muted-2)}
input[type=text],textarea.tx{

const $=q=>document.querySelector(q);
const pad=n=>String(n).padStart(2,"0");
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function monthKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function parseMk(k){const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,1)}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const init=n=>esc(n).replace(/[^A-Za-z0-9]/g,"").charAt(0).toUpperCase()||"•";
const NF=new Intl.NumberFormat("en-IN");
function rupees(p,opts){
  opts=opts||{};
  if(App&&App.data&&App.data.settings&&App.data.settings.hideBalances&&!opts.show)return "₹••••";
  const r=Math.abs(p||0)/100;
  const whole=Math.floor(r),paise=Math.round((r-whole)*100);
  const showPaise = (p%100)!==0 ;
  let str=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",currencyDisplay:"symbol",
    minimumFractionDigits:0,maximumFractionDigits:0}).format(whole);
  if(showPaise)str+= "."+pad(paise);
  return p<0?"-"+str:str;
}
function money(n){return NF.format(n)}
function sig(n){
  if(n>=100)return String(Math.round(n));
  if(n>=10)return String(parseFloat(n.toFixed(1)));
  return String(parseFloat(n.toFixed(2)));
}
function shortAmt(p){
  if(App&&App.data&&App.data.settings&&App.data.settings.hideBalances)return "•••";
  let r=Math.abs(p||0)/100;
  if(r>=10000000)return sig(r/10000000)+"Cr";
  if(r>=100000)return sig(r/100000)+"L";
  if(r>=1000)return sig(r/1000)+"k";
  return String(Math.round(r));
}

/* ============================ STORAGE (IDB → localStorage → memory) ============================ */
const Store={
  kind:"mem",db:null,mem:{},
  init(){return new Promise(res=>{
    let localOk=false;try{localStorage.setItem("__q","1");localStorage.removeItem("__q");localOk=true}catch(e){}
    this._k=localOk?"local":"mem";
    let idb=null;try{idb=window.indexedDB}catch(e){}
    if(!idb){this.kind=this._k;return res(this)}
    try{
      const rq=idb.open("xpend",1);
      rq.onupgradeneeded=e=>{e.target.result.createObjectStore("kv")};
      rq.onsuccess=()=>{this.db=rq.result;this.kind="idb";this.migrate().then(()=>res(this))};
      rq.onerror=()=>{this.kind=this._k;res(this)};
      rq.onblocked=()=>{this.kind=this._k;res(this)};
    }catch(e){this.kind=this._k;res(this)}
  })},
  _has(k){return new Promise(r=>{
    try{const st=this.db.transaction("kv");const t=st.objectStore("kv").get(k);t.onsuccess=()=>r(t.result!=null);t.onerror=()=>r(false)}catch(e){r(false)}
  })},
  _put(k,v){return new Promise(r=>{
    try{const t=this.db.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}
  })},
  async migrate(){
    if(!(await this._has("doc"))){
      /* legacy IDB db from the "quanto" era */
      try{
        const old=await new Promise(r=>{const q=indexedDB.open("quanto",1);q.onupgradeneeded=()=>{};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
        if(old){
          try{
            const doc=await new Promise(r=>{try{const t=old.transaction("kv").objectStore("kv").get("doc");t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}});
            if(doc)await this._put("doc",doc);
          }catch(e){}
          try{old.close()}catch(e){}
        }
      }catch(e){}
    }
    /* legacy localStorage prefix */
    try{
      const oldR=localStorage.getItem("quanto:doc");
      if(oldR){
        localStorage.setItem("xpend:doc",oldR);localStorage.removeItem("quanto:doc");
      }
      const newR=localStorage.getItem("xpend:doc");
      if(newR&&this.kind==="idb"){await this._put("doc",JSON.parse(newR));localStorage.removeItem("xpend:doc")}
    }catch(e){}
  },
  get(k){return new Promise(res=>{
    if(this.kind==="idb"){
      let t=null;try{const st=this.db.transaction("kv");t=st.objectStore("kv").get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}
    }else if(this.kind==="local"){try{const r=localStorage.getItem("xpend:"+k);res(r?JSON.parse(r):null)}catch(e){res(null)}}
    else{res(k in this.mem?this.mem[k]:null)}
  })},
  set(k,v){return new Promise(res=>{
    if(this.kind==="idb"){
      try{const t=this.db.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}
    }else if(this.kind==="local"){try{localStorage.setItem("xpend:"+k,JSON.stringify(v));res(true)}catch(e){res(false)}}
    else{this.mem[k]=v;res(true)}
  })}
};

/* ============================ CRYPTO (WebCrypto AES-256-GCM + PBKDF2) ============================ */
const C={
  b64(u){let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},
  unb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u},
  rand(n){return crypto.getRandomValues(new Uint8Array(n))},
  der(pass,salt){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"])
      .then(k=>crypto.subtle.deriveKey({name:"PBKDF2",salt:this.unb(salt),iterations:210000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]));
  },
  enc(key,str){
    const iv=this.rand(12);
    return crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(str))
      .then(ct=>({iv:this.b64(iv),ct:this.b64(new Uint8Array(ct))}));
  },
  dec(key,iv,ct){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:this.unb(iv)},key,this.unb(ct))
      .then(pt=>new TextDecoder().decode(pt));
  },
  sup(){return !!(window.crypto&&window.crypto.subtle&&crypto.getRandomValues)}
};

/* ============================ GIST BACKUP (M5) ============================ */
const Gist={
  key:null,_t:null,

  cfg(){return App.data&&App.data.settings&&App.data.settings.gist},
  connected(){const c=this.cfg();return !!c&&!!c.gistId},
  unlocked(){return !!this.key},
  dirty(){const c=this.cfg();return !!(c&&c.dirty)},

  saveCfg(){Store.set("doc",App.data)},

  /* persist the derived key so reloads can auto-unlock and pull */
  kStore(){
    if(!this.key)return Promise.resolve();
    return crypto.subtle.exportKey("raw",this.key).then(b=>{
      let s="";const u=new Uint8Array(b);
      for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
      try{localStorage.setItem("xpend:k",btoa(s))}catch(e){}
    });
  },
  kLoad(){
    const s=localStorage.getItem("xpend:k");
    if(!s)return Promise.resolve(false);
    try{
      const b=atob(s),u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      return crypto.subtle.importKey("raw",u,"AES-GCM",false,["encrypt","decrypt"])
        .then(k=>{this.key=k;return true}).catch(()=>false);
    }catch(e){return Promise.resolve(false)}
  },
  kClear(){try{localStorage.removeItem("xpend:k")}catch(e){}},

  pat(){
    const c=this.cfg();
    return C.dec(this.key,c.patCipher.iv,c.patCipher.ct).then(p=>p.trim());
  },
  api(method,path,body){
    return this.pat().then(pat=>{
      const h={"Accept":"application/vnd.github+json","Authorization":"token "+pat};
      return fetch("https://api.github.com"+path,{method,headers:h,body:body?JSON.stringify(body):undefined})
        .then(r=>{
          if(!r.ok)return r.json().then(j=>{throw new Error(j.message||"HTTP "+r.status)});
          return r.status===204?null:r.json();
        });
    });
  },

  envelope(salt){
    return C.enc(this.key,JSON.stringify(App.data)).then(e=>({v:1,kdf:{alg:"PBKDF2-SHA256",iterations:210000,salt},cipher:"AES-256-GCM",iv:e.iv,ct:e.ct}));
  },

  /* runs on every data mutation */
  onChange(){
    if(!this.connected())return;
    const c=this.cfg();
    c.dirty=true;this.saveCfg();
    if(!this.key)return;                        /* locked: queued, push runs after unlock */
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.push().catch(e=>App.toast("Backup failed")),2000);
  },

  async push(force){
    const c=this.cfg();
    if(!this.connected()||!this.key)return;
    if(!force&&!c.dirty)return;
    const gistId=c.gistId;
    const env=await this.envelope(c.salt);
    await this.api("PATCH","/gists/"+gistId,{files:{"xpend-backup.json":{content:JSON.stringify(env)}}});
    if(gistId===this.cfg().gistId){this.cfg().dirty=false;this.cfg().lastPushedAt=new Date().toISOString();this.saveCfg()}
  },

  async setup(pass,pat){
    if(!C.sup||!window.fetch)throw new Error("WebCrypto or fetch unavailable");
    pat=pat.trim();
    const salt=C.b64(C.rand(16));
    this.key=await C.der(pass,salt);
    await this.kStore();
    const pc=await C.enc(this.key,pat);
    App.data.settings.gist={gistId:null,salt,patCipher:pc,dirty:true};
    const env=await this.envelope(salt);
    const g=await this.api("POST","/gists",{description:"Xpend encrypted backup",public:false,files:{"xpend-backup.json":{content:JSON.stringify(env)}}});
    App.data.settings.gist.gistId=g.id;
    App.data.settings.gist.dirty=false;
    App.data.settings.gist.lastPushedAt=new Date().toISOString();
    this.saveCfg();
  },

  /* Connect = find an existing backup and restore it, trying each gist until
     the passphrase matches. Creates a new gist ONLY when no backup exists. */
  async connect(pass,pat){
    if(!C.sup()||!window.fetch)throw new Error("WebCrypto or fetch unavailable");
    pat=pat.trim();
    const h={"Accept":"application/vnd.github+json","Authorization":"token "+pat};
    const raw=await fetch("https://api.github.com/gists?per_page=100",{headers:h});
    if(!raw.ok){const j=await raw.json().catch(()=>({}));throw new Error(j.message||"HTTP "+raw.status)}
    const list=await raw.json();
    const cands=(list||[])
      .filter(g=>g.files&&g.files["xpend-backup.json"])
      .sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
    if(cands.length){
      for(const cand of cands){
        try{
          const gid=cand.id;
          const g=await fetch("https://api.github.com/gists/"+gid,{headers:h})
            .then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)));
          const file=g.files&&g.files["xpend-backup.json"];
          if(!file)continue;
          const env=JSON.parse(file.content);
          if(!env||env.v!==1||!env.kdf||!env.kdf.salt)continue;
          const key=await C.der(pass,env.kdf.salt);
          const doc=JSON.parse(await C.dec(key,env.iv,env.ct));
          if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))continue;
          this.key=key;await this.kStore();
          const prev=doc.settings&&doc.settings.gist;
          doc.settings=doc.settings||{};
          doc.settings.gist={gistId:gid,salt:env.kdf.salt,patCipher:await C.enc(key,pat),dirty:false,
            lastPushedAt:(prev&&prev.lastPushedAt)||undefined};
          App.data=doc;this.saveCfg();
          return {restored:true,gistId:gid};
        }catch(e){/* wrong passphrase for this backup — try the next one */}
      }
      const err=new Error("Wrong passphrase or corrupt backup");err.name="OperationError";throw err;
    }
    await this.setup(pass,pat);
    return {restored:false,gistId:this.cfg().gistId};
  },

  async unlock(pass){
    const c=this.cfg();
    if(!c||!c.salt)throw new Error("No backup configured");
    const k=await C.der(pass,c.salt);
    await C.dec(k,c.patCipher.iv,c.patCipher.ct);   /* verify without leaving a bad key installed */
    this.key=k;await this.kStore();
    if(c.dirty){setTimeout(()=>this.push().catch(()=>{}),500);return false}
    const ok=await this.pull();
    if(ok)App.render();
    return ok;
  },

  /* Fetch the current gist backup and load it into the UI */
  async pull(){
    const c=this.cfg();
    if(!c||!c.gistId||!this.key)return false;
    try{
      const g=await this.api("GET","/gists/"+c.gistId);
      const file=g.files&&g.files["xpend-backup.json"];
      if(!file)return false;
      const env=JSON.parse(file.content);
      if(!env||env.v!==1||!env.kdf||!env.kdf.salt||!env.iv||!env.ct)return false;
      const doc=JSON.parse(await C.dec(this.key,env.iv,env.ct));
      if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))return false;
      doc.settings=doc.settings||{};
      if(!doc.settings.gist||!doc.settings.gist.gistId)doc.settings.gist=c;
      App.data=doc;
      migrateCats(App.data);
      migrateSav(App.data);
      migrateBud(App.data);
      if(migrateMerch(App.data))Store.set("doc",App.data).catch(()=>{});
      Store.set("doc",App.data).catch(()=>{});
      this.saveCfg();
      return true;
    }catch(e){return false}
  },

  async restore(pass,gid){
    const c=this.cfg();
    if(!c)throw new Error("No backup configured");
    this.key=await C.der(pass,c.salt);              /* temp key: unlock the stored token */
    const tok=await this.pat();                     /* throws if passphrase is wrong */
    const g=await this.api("GET","/gists/"+((gid&&gid.trim())||c.gistId));
    const file=g.files&&g.files["xpend-backup.json"];
    if(!file)throw new Error("xpend-backup.json not found in gist");
    const env=JSON.parse(file.content);
    if(!env||env.v!==1)throw new Error("Unsupported backup format");
    if(!env.kdf||!env.kdf.salt)throw new Error("Unsupported backup format");
    const key=await C.der(pass,env.kdf.salt);       /* real key of this backup */
    this.key=key;
    await this.kStore();
    const doc=JSON.parse(await C.dec(key,env.iv,env.ct));
    if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.transactions))throw new Error("Not a Xpend backup");
    const prev=doc.settings&&doc.settings.gist;
    doc.settings=doc.settings||{};
    doc.settings.gist={gistId:g.id,salt:env.kdf.salt,patCipher:await C.enc(key,tok),dirty:false,
      lastPushedAt:(prev&&prev.lastPushedAt)||undefined};
    App.data=doc;
    migrateCats(App.data);
    migrateSav(App.data);
    migrateBud(App.data);
    if(migrateMerch(App.data))Store.set("doc",App.data).catch(()=>{});
    Store.set("doc",App.data).catch(()=>{});
    this.saveCfg();
  },

  disconnect(){
    this.key=null;
    this.kClear();
    App.data.settings.gist=null;
    App.save();
  }
};

];
const OLD_CAT_ID={"cat-g":"cat-gro","cat-e":"cat-fd","cat-t":"cat-tra","cat-u":"cat-utl","cat-s":"cat-shp","cat-h":"cat-ext","cat-en":"cat-ent","cat-tr":"cat-tra","cat-r":"cat-hom","cat-o":"cat-ext","cat-sal":"cat-sal","cat-oi":"cat-oi"};
function migrateCats(d){
  const defs=Object.fromEntries(DEF_CATS.map(c=>[c.id,c]));
  const byName=new Map(DEF_CATS.map(c=>[c.name.toLowerCase(),c]));
  const remap={};
  for(const c of d.categories){
    const newId=OLD_CAT_ID[c.id]||(defs[c.id]?c.id:null);
    const repl=newId?defs[newId]:byName.get((c.name||"").toLowerCase());
    if(repl&&repl.id!==c.id){remap[c.id]=repl.id}
    else if(repl&&!c.emoji){c.emoji=repl.emoji}
  }
  let changed=Object.keys(remap).length>0;
  if(changed){
    const used=new Set();
    const out=DEF_CATS.map(def=>{
      const src=d.categories.find(c=>remap[c.id]===def.id);
      if(!src)return null;
      used.add(src.id);
      return {id:def.id,name:def.name,kind:def.kind,color:def.color,emoji:def.emoji};
    }).filter(Boolean);
    for(const c of d.categories){if(!remap[c.id]&&!used.has(c.id))out.push(c)}
    d.categories=out;
    for(const b of d.budgets||[]){if(Array.isArray(b.categoryIds))b.categoryIds=b.categoryIds.map(id=>remap[id]||id)}
    for(const t of d.transactions||[]){if(remap[t.categoryId])t.categoryId=remap[t.categoryId]}
  }
  const s=d.settings=d.settings||{};
  if(s.catV===undefined){
    const have=new Set(d.categories.map(c=>c.id));
    for(const def of DEF_CATS){
      if(!have.has(def.id))d.categories.push({id:def.id,name:def.name,kind:def.kind,color:def.color,emoji:def.emoji});
    }
    s.catV=2;
    changed=true;
  }
  return changed;
}
function migrateSav(d){
  const s=d.settings=d.settings||{};
  if(s.savV===2)return false;
  let changed=false;
  for(const a of d.accounts||[]){
    if(a.kind!=="savings")continue;
    if(a.cur!=null){
      let net=0;
      for(const t of d.transactions||[]){
        if(t.dir==="trans"){
          if(t.from===a.id)net-=t.amount;
          if(t.to===a.id)net+=t.amount;
        }else if(t.accountId===a.id){
          net+=t.dir==="income"?t.amount:-t.amount;
        }
      }
      a.opening=(a.opening||0)+(a.cur||0)-net;
      delete a.cur;
      changed=true;
    }
    if(a.prev==null){a.prev=a.opening||0;changed=true}
  }
  s.savV=2;
  return changed;
}
function migrateBud(d){
  d.budgets=(d.budgets||[]).map(b=>{if(!b.mkey)b.mkey=monthKey(new Date());return b});
}
function migrateGoals(d){
  const s=d.settings=d.settings||{};
  if(s.goalV===1)return false;
  let changed=false;
  for(const g of d.goals||[]){
    if(g.sources==null){g.sources=[];changed=true}
    if(g.completed==null){g.completed=false;changed=true}
    if(g.date==null){g.date="";changed=true}
    if(g.completedAt==null&&g.completed){g.completedAt=new Date().toISOString().slice(0,7);changed=true}
  }
  s.goalV=1;
  return changed;
}
const DEF_ACCS=[
  {id:"acc-cash",name:"Cash",kind:"cash",opening:0,color:"#7C9AA6"},
  {id:"acc-card",name:"Card",kind:"card",opening:0,color:"#8CA683"}

  {id:"mer-swiggy",name:"Swiggy",icon:"swiggy",color:"#FC8019"},
