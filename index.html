function defaultDoc(){
  return {schemaVersion:1,meta:{createdAt:new Date().toISOString()},
    settings:{currency:"INR",monthStartDay:1,weekStartsOn:1,hideBalances:false,highlightNoMerchant:true,lastDate:null,lastCategoryId:null,lastMerchantId:"",catV:2,goalV:1,merchV:2},
    categories:JSON.parse(JSON.stringify(DEF_CATS)),
    accounts:JSON.parse(JSON.stringify(DEF_ACCS)),
    merchants:JSON.parse(JSON.stringify(DEF_MERCHS)),
    transactions:[],goals:[],budgets:[],shortcuts:[]};
}
function migrateMerch(d){
  const s=d.settings=d.settings||{};
  if(s.merchV===1){
    if(!Array.isArray(d.merchants))d.merchants=[];
    const preseed={};
    for(const m of DEF_MERCHS)preseed[m.id]=m.icon||null;
    let changed=false;
    for(const m of d.merchants){
      if(m&&preseed.hasOwnProperty(m.id)&&m.icon!==preseed[m.id]){
        m.icon=preseed[m.id];changed=true;
      }
    }
    s.merchV=2;
    return changed;
  }
  if(s.merchV>=2)return false;
  /* legacy (pre-merchant or unversioned): seed defaults only when empty */
  if(!Array.isArray(d.merchants)||!d.merchants.length){
    d.merchants=JSON.parse(JSON.stringify(DEF_MERCHS));
    s.merchV=2;
    return true;
  }
  s.merchV=2;
  return false;
}

/* ============================ APP ============================ */
const TABS=[
  {id:"activity",label:"Activity",icon:IC.list},
  {id:"summary",label:"Summary",icon:IC.pie},
  {id:"budget",label:"Budget",icon:IC.trend},
  {id:"goals",label:"Goals",icon:IC.target},
  {id:"analytics",label:"Analytics",icon:IC.bars},
  {id:"accounts",label:"Accounts",icon:IC.wallet}
];

const App={
  data:null,view:"overview",prevView:"overview",
  mkey:monthKey(new Date()),
  add:null,dp:null,budSet:null,pendingDel:null,txOpen:null,tr:null,_scrollRestore:null,
  flt:{q:"",dir:"all",cat:"all",acc:"all",merch:"all"},

  /* ---------- boot ---------- */
  async boot(){
    await Store.init();
    let d=null;try{d=await Store.get("doc")}catch(e){}
    if(!d)d=defaultDoc();
    if(!d.settings)d.settings=defaultDoc().settings;
    if(!Array.isArray(d.categories)||!d.categories.length)d.categories=JSON.parse(JSON.stringify(DEF_CATS));
    if(migrateCats(d))Store.set("doc",d).catch(()=>{});
    if(migrateSav(d))Store.set("doc",d).catch(()=>{});
    if(!Array.isArray(d.accounts)||!d.accounts.length)d.accounts=JSON.parse(JSON.stringify(DEF_ACCS));
    d.goals=d.goals||[];d.shortcuts=d.shortcuts||[];d.transactions=d.transactions||[];
    if(!Array.isArray(d.merchants)||!d.merchants.length){d.merchants=migrateMerch(d)?d.merchants:[]}
    migrateBud(d);
    if(migrateGoals(d))Store.set("doc",d).catch(()=>{});
    this.data=d;
    this.add=this.freshAdd();
    const now=new Date();this.dp={y:now.getFullYear(),m:now.getMonth()};
this.render();
    /* a connected app should live by its gist backup — auto-unlock (persisted key) or ask */
    if(Gist.connected()){
      Gist.kLoad().then(ok=>{
        if(ok){
          if(Gist.dirty())Gist.push().catch(()=>{});
          else Gist.pull().then(p=>{if(p)App.render()});
        }else{
          setTimeout(()=>{if(Gist.connected()&&!Gist.unlocked())App.openSheet(App.gbUnlockSheet())},350);
        }
      });
    }
  },
  freshAdd(){
    const s=this.data&&this.data.settings;
    const d=this.data;
    const cid=(s&&s.lastCategoryId)||"cat-gro";
    const mid=s&&s.lastMerchantId&&(d.merchants||[]).some(m=>m.id===s.lastMerchantId)?s.lastMerchantId:"";
    return {amount:"",dir:"expense",categoryId:d&&d.categories.some(c=>c.id===cid)?cid:"cat-gro",accountId:d&&d.accounts[0]?d.accounts[0].id:"",
      date:(s&&s.lastDate)||todayStr(),note:"",merchantId:mid};
  },
  save(){
    this.data.meta.updatedAt=new Date().toISOString();
    Store.set("doc",this.data);
    Gist.onChange();
  },
  toast(msg){
    const t=$("#toast");t.textContent=msg;t.classList.add("on");
    clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove("on"),1900);
  },
  rerender(){this.render()},
  restoreScroll(){
    if(App._scrollRestore==null)return;
    const s=$("#screen");if(s)s.scrollTop=App._scrollRestore;
    App._scrollRestore=null;
  },

  /* ---------- render ---------- */
  render(){
    this.renderNav();
    const scr=$("#screen");
    const appEl=document.getElementById("app");
    appEl.classList.toggle("ov",this.view==="overview"||this.view==="category");
    appEl.classList.toggle("add",this.view==="add");
    let html="";
    if(this.view==="add"){html=this.addScreen()}
    else if(this.view==="overview"){html=this.overview()}
    else if(this.view==="activity"){html=this.activity()}
    else if(this.view==="summary"){html=this.summary()}
    else if(this.view==="budget"){html=this.budget()}
    else if(this.view==="category"){html=this.category()}
    else if(this.view==="merchant"){html=this.merchant()}
    else if(this.view==="goals"){html=this.goals()}
    else if(this.view==="analytics"){html=this.analytics()}
    else if(this.view==="accounts"){html=this.accounts()}
    else if(this.view==="settings"){html=this.settings()}
    scr.innerHTML=html+this.floaters();
    scr.scrollTop=0;
  },
  renderNav(){
    const nav=$("#nav");
    nav.innerHTML=TABS.map(t=>{
      const on=(t.id==="activity")?(this.view==="overview"||this.view==="activity"||(this.view==="category"&&(this.prevView==="overview"||this.prevView==="activity"))):(this.view===t.id||(this.view==="category"&&this.prevView===t.id)||(this.view==="merchant"&&this.prevView===t.id));
      return `<button type="button" class="nav-item ${on?"on":""}" data-act="tab" data-tab="${t.id}"><span class="ni-ic">${t.icon}</span><span>${t.label}</span></button>`;
    }).join("");
  },

  /* ---------- domain ---------- */
  sortedTxs(){
    return this.data.transactions.slice().sort((a,b)=>{
      if(a.date===b.date)return (b.createdAt||0)-(a.createdAt||0);
      return a.date<b.date?1:-1;
    });
  },
  monthStats(key){
    let spent=0,inc=0;
    for(const t of this.data.transactions){
      if(t.date.slice(0,7)!==key||t.dir==="trans")continue;
      if(t.dir==="income")inc+=t.amount;else spent+=t.amount;
    }
    return {spent,inc,remaining:Math.max(0,inc-spent),pct:inc>0?Math.min(1,spent/inc):0};
  },
  catSpend(key){
    const map={};
    for(const t of this.data.transactions){
      if(t.dir==="expense"&&t.date.slice(0,7)===key)map[t.categoryId]=(map[t.categoryId]||0)+t.amount;
    }
    return map;
  },
  merchantSpend(key){
    const map={};
    for(const t of this.data.transactions){
      if(t.dir==="expense"&&t.date.slice(0,7)===key){const k=t.merchantId||"__none";map[k]=(map[k]||0)+t.amount}
    }
    return map;
  },
  merchantCount(){
    const map={};
    for(const t of this.data.transactions){
      if(t.dir!=="expense")continue;
      const k=t.merchantId||"__none";map[k]=(map[k]||0)+1
    }
    return map;
  },
  merchAccent(mid){
    const PAL=["#7B61FF","#FF5678","#31C4F3","#FF9F43","#52E5A5","#FFD166","#9B8CFA","#4EC49B"];
    const entries=Object.entries(this.merchantSpend(this.mkey)).sort((a,b)=>b[1]-a[1]);
    const idx=entries.findIndex(e=>e[0]===mid);
    const m=mid==="__none"?null:merchById(mid);
    return idx>=0?PAL[idx%PAL.length]:(m&&m.color)||"#8C52FF";
  },
  catAccent(cid){
    const PAL=["#7B61FF","#FF5678","#31C4F3","#FF9F43","#52E5A5","#FFD166","#9B8CFA","#4EC49B"];
    const entries=Object.entries(this.catSpend(this.mkey)).sort((a,b)=>b[1]-a[1]);
    const idx=entries.findIndex(e=>e[0]===cid);
    const c=catById(cid);
    return idx>=0?PAL[idx%PAL.length]:(c&&c.color)||"#8C52FF";
  },
  shiftMonth(delta){
    const d=parseMk(this.mkey);d.setMonth(d.getMonth()+delta);
    const k=monthKey(d);
    if(k>monthKey(new Date())&&this.view!=="budget")return;
    this.mkey=k;this.render();
  },
  accBalance(id){
    const a=accById(id);
    if(!a)return 0;
    if(a.kind==="savings")return this.netOf(id);
    return (a.opening||0)+this.netOf(id);
  },
  netOf(id,excl){
    let n=0;
    for(const t of this.data.transactions){
      if(excl&&excl.has(t))continue;
      if(t.dir==="trans"){
        if(t.from===id)n-=t.amount;
        if(t.to===id)n+=t.amount;
        continue;
      }
      if(t.accountId!==id)continue;
      n+=t.dir==="income"?t.amount:-t.amount;
    }
    return n;
  },
  savSync(oldT,newT){
    const bump=(a,p)=>{if(a)a.prev=(a.prev==null?0:a.prev)+p};
    const apply=(t,sf)=>{
      if(!t||t.dir!=="trans")return;
      if(t.to==="__prev")bump(accById(t.from),t.amount*sf);
      else if(t.from==="__prev")bump(accById(t.to),-t.amount*sf);
    };
    apply(oldT,-1);apply(newT,1);
  },
  trNames(t){
    const nm=id=>id==="__prev"?"Previous savings":(accById(id)?accById(id).name:"?");
    return nm(t.from)+" → "+nm(t.to);
  },
  budgetSpent(b){
    const key=b.mkey||this.mkey;let s=0;
    for(const t of this.data.transactions){
      if(t.dir!=="expense"||t.date.slice(0,7)!==key)continue;
      if(b.categoryIds&&b.categoryIds.length&&!b.categoryIds.includes(t.categoryId))continue;
      s+=t.amount;
    }
    return s;
  },
  catName(id){const c=catById(id);return c.name},

  /* ============ BUDGET (category budgets + linear pace) ============ */
  expenseCats(){
    return this.data.categories.filter(c=>c.kind==="expense");
  },
  budgetCats(b){
    if(!b||!b.categoryIds||!b.categoryIds.length)return [];
    return b.categoryIds.map(id=>catById(id)).filter(Boolean);
  },
  budgetsFor(mkey){
    return (this.data.budgets||[]).filter(b=>(b.mkey||this.mkey)===mkey);
  },
  isOverall(b){
    return !(b.categoryIds&&b.categoryIds.length);
  },
  catBudgets(mkey){
    return this.budgetsFor(mkey||this.mkey).filter(b=>!this.isOverall(b));
  },
  overallLimit(mkey){
    return this.catBudgets(mkey||this.mkey).reduce((s,b)=>s+(b.limit||0),0);
  },
  aggSpentV(mkey){
    const ids=this.aggIdsRaw(mkey||this.mkey);
    return (ids||[]).length?this.budgetDaily(mkey||this.mkey,ids).reduce((s,v)=>s+v,0):0;
  },
  aggCatIds(mkey){
    const set=new Set();
    for(const b of this.budgetsFor(mkey||this.mkey)){(b.categoryIds||[]).forEach(id=>set.add(id))}
    return set;
  },
  aggIdsRaw(mkey){
    return Array.from(this.aggCatIds(mkey||this.mkey));
  },
  budgetMonthCtx(mkey){
    const mk=parseMk(mkey||this.mkey),now=new Date();
    const isCur=mk.getFullYear()===now.getFullYear()&&mk.getMonth()===now.getMonth();
    const daysInMonth=new Date(mk.getFullYear(),mk.getMonth()+1,0).getDate();
    const past=mk<new Date(now.getFullYear(),now.getMonth(),1);
    const elapsed=isCur?Math.min(now.getDate(),daysInMonth):(past?daysInMonth:0);
    return {isCur,daysInMonth,elapsed,daysLeft:daysInMonth-elapsed};
  },
  budgetDaily(mkey,ids){
    const ctx=this.budgetMonthCtx(mkey);
    const arr=new Array(ctx.daysInMonth).fill(0);
    const set=ids?new Set(ids):null;
    for(const t of this.data.transactions){
      if(t.dir!=="expense"||t.date.slice(0,7)!==mkey)continue;
      if(set&&!set.has(t.categoryId))continue;
      const day=parseInt(t.date.slice(8,10),10)||1;
      if(day>=1&&day<=ctx.daysInMonth)arr[day-1]+=t.amount;
    }
    return arr;
  },
  budgetDailyCum(mkey,ids){
    const a=this.budgetDaily(mkey,ids);let acc=0;
    return a.map(v=>acc+=v);
  },
  budgetCtx(mkey,limit,spent){
    const ctx=this.budgetMonthCtx(mkey);
    const expected=Math.round(limit*ctx.elapsed/ctx.daysInMonth);
    const pct=limit>0?spent/limit:0;
    const overage=Math.max(0,spent-limit);
    const remaining=Math.max(0,limit-spent);
    const safeDaily=remaining>0?Math.floor(remaining/Math.max(ctx.daysLeft,1)/100)*100:0;
    const status=spent>limit?"over":(spent>expected?"ahead":"on");
    return {spent,expected,pct,overage,remaining,safeDaily,status,daysInMonth:ctx.daysInMonth,elapsed:ctx.elapsed,daysLeft:ctx.daysLeft};
  },
  budgetAccent(b){
    const cats=this.budgetCats(b);
    if(cats.length)return cats[0].color||"#8C52FF";
    return "#52E5A5";
  },
  budStLabel(status){
    return status==="over"?"Over":status==="ahead"?"Ahead — slow down":"On pace";
  },
  budStClass(status){
    return status==="over"?"err":status==="ahead"?"warn":"on";
  },
  budBarColor(c){
    return c.pct>=1?"#FF5A5A":(c.status==="ahead"||c.pct>=0.8)?"#FF9F43":"#52E5A5";
  },
  budPaceTxt(c){
    if(c.status==="over")return "Over by "+rupees(c.overage)+" · safe pace is ₹0";
    return "Spend ≤ "+rupees(c.safeDaily)+"/day for "+(c.daysLeft>0?c.daysLeft:"no")+" more day"+(c.daysLeft===1?"":"s")+" to stay on budget";
  },
  budPaceSvg(mkey,ids,limit,accent,w,h){
    const ctx=this.budgetMonthCtx(mkey);
    const cum=this.budgetDailyCum(mkey,ids);
    const days=Math.max(ctx.daysInMonth,1);
    const maxV=Math.max(limit||0,cum.length?Math.max.apply(null,cum):0,1);
    const P=6;
    const x=d=>P+(d/days)*(w-2*P);
    const y=v=>h-P-(v/maxV)*(h-2*P);
    const pts=cum.map((v,i)=>x(i+1).toFixed(1)+","+y(v).toFixed(1)).join(" ");
    const diag="M"+P.toFixed(1)+","+y(0).toFixed(1)+" L"+(w-P).toFixed(1)+","+y(limit||0).toFixed(1);
    const today=ctx.isCur&&ctx.elapsed>=1
      ?`<circle cx="${x(ctx.elapsed).toFixed(1)}" cy="${y(cum[ctx.elapsed-1]||0).toFixed(1)}" r="2.6" fill="#D6DADD"/>`
      :"";
    return `<svg viewBox="0 0 ${w} ${h}" class="bud-spark" role="img" aria-label="Pace chart">
      <line x1="${P}" y1="${y(limit||0)}" x2="${w-P}" y2="${y(limit||0)}" stroke="#3A4147" stroke-width="1.1" stroke-dasharray="4 3"/>
      <path d="${diag}" stroke="#3A4147" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity=".6"/>
      <polyline points="${pts}" fill="none" stroke="${accent}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      ${today}
    </svg>`;
  },

  /* ---------- budget screens ---------- */
  budget(){
    const budgets=this.budgetsFor(this.mkey);
    const mk=parseMk(this.mkey);
    const prev=new Date(mk);prev.setMonth(prev.getMonth()-1);
    const prevKey=monthKey(prev);
    const st=this.monthStats(this.mkey);
    const prevSt=this.monthStats(prevKey);
    const pct=prevSt.spent>0?Math.round((prevSt.spent-st.spent)/prevSt.spent*100):null;
    const down=pct!=null&&pct>=0;
    const monthName=mk.toLocaleDateString("en-IN",{month:"long"});
    const prevName=parseMk(prevKey).toLocaleDateString("en-IN",{month:"short"});
    const dIcon=down?IC.downcir:`<span style="transform:scaleY(-1);display:inline-flex">${IC.downcir}</span>`;
    const aggLimit=this.overallLimit(this.mkey);
    const aggIds=this.aggIdsRaw(this.mkey);
    const aggSpent=this.aggSpentV(this.mkey);
    const agg=this.budgetCtx(this.mkey,aggLimit,aggSpent);
    const unbudgeted=Math.max(0,st.spent-aggSpent);
    const stOf=b=>{const all=this.isOverall(b);return this.budgetCtx(b.mkey||this.mkey,all?this.overallLimit(b.mkey||this.mkey):(b.limit||0),all?this.aggSpentV(b.mkey||this.mkey):this.budgetSpent(b)).status};
    const onN=budgets.filter(b=>stOf(b)==="on").length;
    const aheadN=budgets.filter(b=>stOf(b)==="ahead").length;
    const overN=budgets.filter(b=>stOf(b)==="over").length;
    const stL=this.budStLabel(agg.status),stC=this.budStClass(agg.status);
    return `
    <div class="scr">
      <header class="scrhdr"><div class="hdr-title">Budget</div><div class="hdr-left"><button class="btn mini" data-act="budget-add">${IC.plus} Set budget</button></div></header>
      <button class="ov-sum swipe-mk" data-act="mk-open" aria-label="Select month">
        <span class="ov-mon">${esc(monthName)} ${IC.chev}</span>
        <span class="ov-total">${rupees(st.spent)}</span>
        ${pct==null?`<span class="ov-delta" style="color:var(--muted)">${IC.downcir} No earlier data</span>`
          :`<span class="ov-delta"${down?"":' style="color:var(--neg)"'}>${dIcon} ${Math.abs(pct)}% ${down?"from":"up from"} ${prevName}</span>`}
      </button>
      ${budgets.length?`
      <div class="card"><div class="card-title">Overview</div>
        <div class="metrics-grid">
          <div class="metric"><span class="metric-val">${rupees(aggLimit)}</span><span class="metric-lbl">Total Budget</span></div>
          <div class="metric"><span class="metric-val">${rupees(aggSpent)}</span><span class="metric-lbl">Spent</span></div>
          <div class="metric"><span class="metric-val ${agg.remaining===0?"neg":""}">${rupees(agg.remaining)}</span><span class="metric-lbl">Remaining</span></div>
          <div class="metric"><span class="metric-val">${agg.status==="over"?"₹0":agg.safeDaily>0?rupees(agg.safeDaily)+"/day":"—"}</span><span class="metric-lbl">Safe pace</span></div>
        </div>
        <div class="status-pills" style="margin-top:14px">
          <span class="pill on">${onN} On Pace</span>
          <span class="pill ${aheadN?"warn":""}">${aheadN} Ahead of pace</span>
          <span class="pill ${overN?"err":""}">${overN} Over</span>
          <span class="pill ${unbudgeted>0?"warn":""}">${unbudgeted>0?rupees(unbudgeted):"₹0"} Unbudgeted</span>
        </div>
      </div>
      <div class="card"><div class="card-title">Keeping it linear</div>
        ${this.budPaceSvg(this.mkey,aggIds,aggLimit,"#52E5A5",300,100)}
        <div class="bud-pace-row">
          <span class="pill ${stC}">${stL}</span>
          <span class="bud-pace-txt">${this.budPaceTxt(agg)}</span>
        </div>
        <div class="bud-chax"><span>1</span><span>${Math.ceil(agg.daysInMonth/2)}</span><span>${agg.daysInMonth}</span></div>
      </div>
      <div class="sec-label">Budgets</div>
      ${budgets.map((b,i)=>this.budgetCard(b,i)).join("")}
      ${unbudgeted>0?`<div class="bud-strip">${rupees(unbudgeted)} spent outside budgets this month</div>`:""}`
      :`<div class="card" style="border-radius:24px"><div class="empty"><div>${IC.trend}</div><div class="t">No budgets yet</div><div class="s">Tap <b>Set budget</b> to cap your spending per category</div></div></div>`}
    </div>`;
  },
  budgetCard(b,i){
    const cats=this.budgetCats(b);
    const all=this.isOverall(b);
    let limit=b.limit||0,spent=this.budgetSpent(b),ids=all?null:b.categoryIds;
    if(all){limit=this.overallLimit(b.mkey||this.mkey);ids=this.aggIdsRaw(b.mkey||this.mkey);spent=this.aggSpentV(b.mkey||this.mkey)}
    const c=this.budgetCtx(b.mkey||this.mkey,limit,spent);
    const accent=all?"#52E5A5":this.budgetAccent(b);
    const pct=Math.round(c.pct*100);
    const stL=this.budStLabel(c.status),stC=this.budStClass(c.status);
    const names=all?"All expenses":cats.length?cats.map(x=>x.name).join(" · "):"Categories removed";
    const icon=all?IC.trend:catEmoji(cats[0]);
    const chipTxt=c.status==="over"?("Over by "+rupees(c.overage)):c.status==="ahead"?"Ahead — slow down":"On pace";
    const paceTxt=c.status==="over"?"safe pace is ₹0":"≤ "+rupees(c.safeDaily)+"/day for "+(c.daysLeft>0?c.daysLeft:"no")+" more day"+(c.daysLeft===1?"":"s");
    const chipC=c.status==="over"?"err":c.status==="ahead"?"warn":"ok";
    return `<div class="card goal-row" data-act="budget-open" data-id="${b.id}" role="button">
      <div class="goal-head">
        <span class="ccircle" style="--c:${accent}">${icon}</span>
        <span class="goal-name">${esc(b.name)}</span>
        <span class="pill ${stC}">${stL}</span>
      </div>
      <div class="goal-pbar"><div class="goal-pbar-track"><i style="width:${Math.min(100,c.pct*100)}%;background:${this.budBarColor(c)}"></i></div><span class="goal-pct">${pct}%</span></div>
      <div class="goal-fig"><span class="goal-saved">${rupees(c.spent)}</span><span class="goal-of">of ${rupees(limit)} spent · ${pct}%</span></div>
      ${this.budPaceSvg(b.mkey||this.mkey,ids,limit,accent,240,56)}
      <div class="goal-foot">
        <span class="gchip">${esc(names)}</span>
        <span class="gchip ${chipC}">${chipTxt}</span>
        <span class="gchip">${paceTxt}</span>
      </div>
    </div>`;
  },
  budgetSheet(id){
    const cats=this.expenseCats();
    const sel=new Set(this._budCats||[]);
    const mkey=this._budMkey||this.mkey;
    const mw=this.budgetMonthChips();
    return `
      <div class="sh-grab"></div>
      <div class="sh-title">${id?"Edit budget":"Set budget"}</div>
      <div class="goal-calc" id="budget-calc" style="display:none"></div>
      <input type="text" id="bb-n" placeholder="What is this budget for?" value="${esc(this._budName||"")}">
      ${sel.size===0
        ?`<div class="tsub" style="background:rgba(255,255,255,.05);padding:10px 12px;border-radius:12px;margin-top:8px">Overall cap auto-calculates as the sum of your category budgets.</div>`
        :`<div class="tsub" style="margin-bottom:2px">Monthly limit (₹)</div>
      <input type="text" id="bb-t" inputmode="decimal" placeholder="e.g. 30000" value="${esc(this._budLimit||"")}" style="margin-top:0">`}
      <div class="tsub" style="margin:6px 2px 2px">Month</div>
      <div class="chip-row">
        ${mw.map(k=>`<button class="chip ${k===mkey?"on":""}" data-act="bud-mm" data-key="${k}"><span class="dot" style="--c:${k===monthKey(new Date())?"#52E5A5":"#3A4147"}"></span>${esc(this.monthShort(k))}</button>`).join("")}
      </div>
      <div class="tsub" style="margin:6px 2px 2px">Categories</div>
      <div class="chip-row">
        <button class="chip ${sel.size===0?"on":""}" data-act="bud-all"><span class="dot" style="--c:#52E5A5"></span>All expenses</button>
        ${cats.map(c=>`<button class="chip ${sel.has(c.id)?"on":""}" data-act="bud-cat" data-id="${c.id}"><span class="dot" style="--c:${c.color}"></span>${esc(c.name)}</button>`).join("")}
      </div>
      <button class="btn" style="margin-top:16px" data-act="budget-save" data-id="${id||""}">${IC.check} ${id?"Save budget":"Set budget"}</button>`;
  },
  budgetMonthChips(){
    const list=[];const d=new Date();d.setMonth(d.getMonth()-5);
    for(let i=0;i<11;i++){list.push(monthKey(d));d.setMonth(d.getMonth()+1)}
    const cur=this._budMkey||this.mkey;
    if(!list.includes(cur))list.unshift(cur);
    return list;
  },
  monthShort(k){return parseMk(k).toLocaleDateString("en-IN",{month:"short",year:"2-digit"})},
  updateBudgetCalc(){
    const box=document.getElementById("budget-calc");
    if(!box)return;
    const name=($("#bb-n")&&$("#bb-n").value||"").trim()||"This budget";
    const set=new Set(App._budCats||[]);
    const mk=App._budMkey||App.mkey;
    const mmName=parseMk(mk).toLocaleDateString("en-IN",{month:"long",year:"numeric"});
    if(set.size===0){
      const limit=App.overallLimit(mk);
      const spent=App.aggSpentV(mk);
      const c=App.budgetCtx(mk,limit,spent);
      const stL=c.status==="over"?"Over":c.status==="ahead"?"Ahead of pace — slow down":"On pace";
      const stC=App.budStClass(c.status);
      const n=App.catBudgets(mk).length;
      const note=n?`<div class="gc-note">Auto cap from <b>${n}</b> category budget${n===1?"":"s"} in ${mmName} — adjust those to change it.</div>`
        :`<div class="gc-note">No category budgets in ${mmName} yet — the overall cap is ₹0 until you add some.</div>`;
      const html=`<div class="goal-calc-hdr">${esc(name)} · <span class="pill ${stC}">${stL}</span></div>
        <div class="gc-grid">
          <div><span class="gc-lbl">Auto cap</span><span class="gc-val">${rupees(limit)}</span></div>
          <div><span class="gc-lbl">Current spend</span><span class="gc-val">${rupees(spent)}</span></div>
          <div><span class="gc-lbl">Remaining</span><span class="gc-val ${c.status==="over"?"neg":""}">${rupees(c.remaining)}</span></div>
          <div><span class="gc-lbl">Progress</span><span class="gc-val">${Math.round(c.pct*100)}%</span></div>
        </div>
        ${note}`;
      box.innerHTML=html;
      box.style.display="block";
      return;
    }
    const limit=Math.round(parseFloat(($("#bb-t")&&$("#bb-t").value||"").replace(/,/g,""))||0)*100;
    if(!limit){box.style.display="none";return}
    let spent=0;
    for(const t of this.data.transactions){
      if(t.dir!=="expense"||t.date.slice(0,7)!==mk)continue;
      if(set.size&&!set.has(t.categoryId))continue;
      spent+=t.amount;
    }
    const c=this.budgetCtx(mk,limit,spent);
    const stL=c.status==="over"?"Over":c.status==="ahead"?"Ahead of pace — slow down":"On pace";
    const stC=this.budStClass(c.status);
    const note=
      c.status==="over"?`<div class="gc-note err">Over by <b>${rupees(c.overage)}</b> — trim spending to get back on budget.</div>`
      :c.elapsed===0?`<div class="gc-note">Planned for <b>${mmName}</b> — nothing spent yet. Safe pace <b>${rupees(c.safeDaily)}/day</b> keeps you on budget.</div>`
      :c.status==="ahead"?`<div class="gc-note warn">Ahead of the linear pace — safe pace is <b>${rupees(c.safeDaily)}/day</b>.</div>`
      :`<div class="gc-note">On pace — ${rupees(spent)} of ${rupees(c.expected)} expected by day ${c.elapsed} · safe pace <b>${rupees(c.safeDaily)}/day</b>.</div>`;
    const html=`<div class="goal-calc-hdr">${esc(name)} · <span class="pill ${stC}">${stL}</span></div>
      <div class="gc-grid">
        <div><span class="gc-lbl">Current spend</span><span class="gc-val">${rupees(spent)}</span></div>
        <div><span class="gc-lbl">Limit</span><span class="gc-val">${rupees(limit)}</span></div>
        <div><span class="gc-lbl">Remaining</span><span class="gc-val ${c.remaining===0||c.status==="over"?"neg":""}">${rupees(c.remaining)}</span></div>
        <div><span class="gc-lbl">Progress</span><span class="gc-val">${Math.round(c.pct*100)}%</span></div>
      </div>
      ${note}`;
    box.innerHTML=html;
    box.style.display="block";
  },
  budgetDetailSheet(id){
    const b=this.data.budgets.find(x=>x.id===id);if(!b)return "";
    const cats=this.budgetCats(b);
    const all=this.isOverall(b);
    let limit=b.limit||0,spent=this.budgetSpent(b);
    if(all){limit=this.overallLimit(b.mkey||this.mkey);spent=this.aggSpentV(b.mkey||this.mkey)}
    const c=this.budgetCtx(b.mkey||this.mkey,limit,spent);
    const accent=all?"#52E5A5":this.budgetAccent(b);

        :c.status==="ahead"?`<div class="gd-note">Ahead of the linear pace — spent ${rupees(c.spent)} of ${rupees(c.expected)} expected by now. Safe pace is <b>${rupees(c.safeDaily)}/day</b>.</div>`
        :`<div class="gd-note">On pace — spent ${rupees(c.spent)} of ${rupees(c.expected)} expected by now.</div>`}
      <div class="sec-label" style="margin-top:16px">Budget</div>
      <div class="slab">
        <span class="s-label">Month<div class="s-sub">Applies only to this month</div></span>
        <span>${esc(bMonthName)}</span>
      </div>
      <div class="slab">
        <span class="s-label">Categories<div class="s-sub">${esc(names)}</div></span>
        <span>${all?"All":cats.length+" cat"+(cats.length===1?"":"s")}</span>
      </div>
      <div class="slab">
        <span class="s-label">Period<div class="s-sub">One month — does not repeat</div></span>
        <span>Monthly</span>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn ghost" style="flex:1" data-act="budget-edit" data-id="${b.id}">Edit</button>
      </div>
      <button class="btn ghost" style="width:100%;margin-top:12px;color:var(--neg);border-color:rgba(192,91,77,.35)" data-act="budget-del" data-id="${b.id}">${IC.trash} ${this.pendingDel===id?"Tap again to delete":"Delete budget"}</button>`;
  },

  /* ============ OVERVIEW (dashboard, reference UI) ============ */
  overview(){
    const st=this.monthStats(this.mkey),mk=parseMk(this.mkey);
    const prev=new Date(mk);prev.setMonth(prev.getMonth()-1);
    const prevKey=monthKey(prev),prevSt=this.monthStats(prevKey);
    const pct=prevSt.spent>0?Math.round((prevSt.spent-st.spent)/prevSt.spent*100):null;
    const down=pct!=null&&pct>=0;
    const monthName=mk.toLocaleDateString("en-IN",{month:"long"});
    const prevName=parseMk(prevKey).toLocaleDateString("en-IN",{month:"short"});
    const flt=this.flt;
    let list=this.sortedTxs();
    if(flt.dir!=="all")list=list.filter(t=>t.dir===flt.dir);
    if(flt.acc!=="all")list=list.filter(t=>t.accountId===flt.acc||t.from===flt.acc||t.to===flt.acc);
    const groups=[];
    for(const t of list){
      let g=groups[groups.length-1];
      if(!g||g.date!==t.date){g={date:t.date,items:[]};groups.push(g)}
      g.items.push(t);
    }
    const dIcon=down?IC.downcir:`<span style="transform:scaleY(-1);display:inline-flex">${IC.downcir}</span>`;
    return `
    <div class="scr ov">
      <div class="ov-top"><button class="ov-gear" data-act="go-settings" aria-label="Settings">${IC.gear}</button></div>
      <button class="ov-sum swipe-mk" data-act="mk-open" aria-label="Select month">
        <span class="ov-mon">${esc(monthName)} ${IC.chev}</span>
        <span class="ov-total">${rupees(st.spent)}</span>
        ${pct==null?`<span class="ov-delta" style="color:var(--muted)">${IC.downcir} No earlier data</span>`
          :`<span class="ov-delta"${down?"":' style="color:var(--neg)"'}>${dIcon} ${Math.abs(pct)}% ${down?"from":"up from"} ${prevName}</span>`}
      </button>
      ${this.chart()}
      ${this.chips(true)}
      <div class="ov-groups">
        ${groups.length?groups.map((g,i)=>
          ((i===0||groups[i-1].date.slice(0,7)!==g.date.slice(0,7))
            ?`<div class="ov-mh">${parseMk(g.date.slice(0,7)).toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</div>`:"")+
          `<div class="ov-dg"><span class="ov-dg-day">${dayLabel(g.date)}</span><span class="ov-dg-amt">${rupees(g.items.reduce((s,t)=>s+(t.dir==="expense"?t.amount:0),0))}</span></div>
          <div class="ov-day">
            ${g.items.map(t=>this.ovCard(t)).join("")}
          </div>`
        ).join("")
          :`<div class="card" style="border-radius:24px"><div class="empty"><div>${IC.empty}</div><div class="t">No transactions yet</div><div class="s">Tap + below to add your first expense</div></div></div>`}
      </div>
    </div>`;
  },
  daily(cid,mid){
    const dim=new Date(parseMk(this.mkey).getFullYear(),parseMk(this.mkey).getMonth()+1,0).getDate();
    const arr=new Array(dim).fill(0);
    for(const t of this.data.transactions){
      if(t.dir!=="expense"||t.date.slice(0,7)!==this.mkey)continue;
      if(cid&&t.categoryId!==cid)continue;
      if(mid&&(t.merchantId||"__none")!==mid)continue;
      const day=parseInt(t.date.slice(8,10),10)||1;
      arr[day-1]+=t.amount;
    }
    return arr;
  },
  chart(cid,mid){
    const arr=this.daily(cid,mid);
    const mx=Math.max.apply(null,arr)||100;
    const yv=Math.max(100,Math.ceil((mx/0.88)/50)*50);
    const hi=new Set(arr.map((v,i)=>v>0?i:-1).filter(i=>i>=0).slice(-6));
    if(cid&&mx>0){arr.forEach((v,i)=>{if(v===mx)hi.add(i)});const t=new Date();if(t.getFullYear()===parseMk(this.mkey).getFullYear()&&t.getMonth()===parseMk(this.mkey).getMonth()&&arr[t.getDate()-1]>0)hi.add(t.getDate()-1)}
    const bars=arr.map((v,i)=>{
      const h=v>0?Math.round(v/yv*100):3;
      return `<span class="bar${hi.has(i)?" on":""}" style="height:${Math.max(h,3)}%"></span>`;
    }).join("");
    const dim=arr.length;
    return `
    <div class="ov-chart">
      <div class="chart-plot">
        <div class="bars">${bars}</div>
        <span class="dash" style="bottom:${mx>0?88:8}%"></span>
        <span class="ref-label" style="bottom:${mx>0?88:8}%">${shortAmt(mx)}</span>
        <div class="yax">
          <span style="top:0">${shortAmt(yv)}</span>
          <span class="mid" style="top:calc(50% - 8px)">${shortAmt(Math.round(yv/2))}</span>
          <span style="bottom:0">0</span>
        </div>
        <div class="xax">
          <span>1</span><span>8</span><span>16</span><span>23</span><span>${dim}</span>
        </div>
      </div>
    </div>`;
  },
  chips(dash){
    const flt=this.flt;
    const acc=flt.acc!=="all"?accById(flt.acc):null;
    const accTxt=acc?(acc.name.length>11?acc.name.slice(0,11)+"…":acc.name):"All accounts";

    <div class="ov-chips">

  },
  ovCard(t){
    if(t.dir==="trans"){
      return `<button class="ov-card" data-act="open-txn" data-id="${t.id}">

  /* ============ SUMMARY (donut-overview + category breakdown) ============ */
  summary(){
    const mk=parseMk(this.mkey);
    const prev=new Date(mk);prev.setMonth(prev.getMonth()-1);
    const prevKey=monthKey(prev),prevSt=this.monthStats(prevKey);
    const cur=new Date();
    const monthLabel=mk.getFullYear()===cur.getFullYear()&&mk.getMonth()===cur.getMonth()
      ?"This month":mk.toLocaleDateString("en-IN",{month:"long"});
    const txs=this.data.transactions.filter(t=>
      t.dir==="expense"&&t.date.slice(0,7)===this.mkey&&(this.flt.acc==="all"||t.accountId===this.flt.acc));
    const catMap={};
    for(const t of txs)catMap[t.categoryId]=(catMap[t.categoryId]||0)+t.amount;
    const entries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
    const total=entries.reduce((s,e)=>s+e[1],0);
    const pct=prevSt.spent>0?Math.round((prevSt.spent-total)/prevSt.spent*100):null;
    const down=pct!=null&&pct>=0;
    const prevName=parseMk(prevKey).toLocaleDateString("en-IN",{month:"short"});
    const PAL=["#7B61FF","#FF5678","#31C4F3","#FF9F43","#52E5A5","#FFD166","#9B8CFA","#4EC49B"];
    const colors={};entries.forEach((e,i)=>{colors[e[0]]=PAL[i%PAL.length]});
    const R=110,W=20;
    const C=2*Math.PI*R;
    let acc=0;
    const arcs=entries.map(([cid,amt])=>{
      const seg=total>0?amt/total*C:0;
      const a=`<circle cx="150" cy="150" r="${R}" fill="none" stroke="${colors[cid]}" stroke-width="${W}" stroke-linecap="round"
        stroke-dasharray="${seg.toFixed(2)} ${(C-seg).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"
        transform="rotate(-90 150 150)"/>`;
      acc+=seg;return a;
    }).join("");
    const donut=`<svg viewBox="0 0 300 300" class="donut-svg">
      <g transform="rotate(-90 150 150)">${arcs}</g>
    </svg>`;
    const tIcn=down?IC.downcir:`<span style="transform:scaleY(-1);display:inline-flex">${IC.downcir}</span>`;
    const trend=pct==null?`<span class="dc-trend mute">${IC.downcir} No earlier data</span>`
      :`<span class="dc-trend${down?"":" up"}">${tIcn} ${Math.abs(pct)}% ${down?"from":"up from"} ${prevName}</span>`;
    const cards=entries.map(([cid,amt])=>{
      const c=catById(cid);
      const n=txs.filter(t=>t.categoryId===cid).length;

    }).join("");
    return `
    <div class="scr sum">
      <div class="ov-top"><button class="ov-gear" data-act="go-settings" aria-label="Settings">${IC.gear}</button></div>
      <div class="sum-chart">
        <div class="donut-wrap big">${donut}
          <div class="donut-center swipe-mk">
            <button class="dc-month" data-act="mk-open" aria-label="Select month">${esc(monthLabel)} ${IC.chev}</button>
            <div class="dc-main">${rupees(total)}</div>

      </div>
    </div>`;

  /* ============ ACTIVITY ============ */
  activity(){
    const d=this.data,flt=this.flt;
    let list=this.sortedTxs();
    if(flt.dir!=="all")list=list.filter(t=>t.dir===flt.dir);
    if(flt.cat!=="all")list=list.filter(t=>t.categoryId===flt.cat);
    if(flt.merch!=="all")list=list.filter(t=>(t.merchantId||"__none")===flt.merch);

  /* ============ GOALS ============ */
  goals(){
    const gs=this.data.goals||[];
    const active=gs.filter(g=>!g.completed);
    const totalTarget=gs.reduce((s,g)=>s+(g.target||0),0);
    const totalSaved=gs.reduce((s,g)=>s+this.goalCurrent(g),0);
    const totalRemaining=Math.max(0,totalTarget-totalSaved);
    const onTrack=active.filter(g=>this.goalCalc(g).status==="on-track").length;
    const needsAttention=active.filter(g=>this.goalCalc(g).status==="needs-attention").length;
    const overdue=active.filter(g=>this.goalCalc(g).status==="overdue").length;
    const completed=gs.filter(g=>g.completed).length;
    const monthlyReq=active.reduce((s,g)=>s+(this.goalCalc(g).required||0),0);
    const upcoming=active.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(0,5);
    const done=gs.filter(g=>g.completed);
    const PAL=["#7B61FF","#FF5678","#31C4F3","#FF9F43","#52E5A5","#FFD166","#9B8CFA","#4EC49B"];
    const colors={};gs.forEach((g,i)=>{colors[g.id]=PAL[i%PAL.length]});
    const row=g=>{
      const c=this.goalCalc(g);
      const st=c.status;
      const stL={completed:"Completed","on-track":"On Track","needs-attention":"Needs Attention",overdue:"Overdue"}[st];
      const stC=st==="on-track"?"on":st==="needs-attention"?"warn":st==="overdue"?"err":"ok";
      const chipC=st==="completed"||st==="on-track"?"ok":st==="overdue"?"err":"warn";
      const dateLbl=g.date?parseMk(g.date).toLocaleDateString("en-IN",{month:"short",year:"numeric"}):"No date";
      return `<div class="card goal-row" data-act="goal-open" data-id="${g.id}" role="button">
        <div class="goal-head">
          <span class="ccircle" style="--c:${colors[g.id]}">${init(g.name)}</span>
          <span class="goal-name">${esc(g.name)}</span>
          <span class="pill ${stC}">${stL}</span>
        </div>
        <div class="goal-pbar ${st==="overdue"?"err":""}"><div class="goal-pbar-track"><i style="width:${Math.min(100,c.pct)}%"></i></div><span class="goal-pct">${Math.round(c.pct)}%</span></div>
        <div class="goal-fig"><span class="goal-saved">${rupees(c.current)}</span><span class="goal-of">of ${rupees(c.target)} saved</span></div>
        <div class="goal-foot">
          ${g.completed?`<span class="gchip ok">${IC.check} Purchased · ${rupees(g.actualAmount)}</span>`
          :`<span class="gchip">${IC.cal} ${dateLbl}</span><span class="gchip ${chipC}">${IC.trend} ${rupees(c.required)}/mo</span>`}
        </div>
      </div>`;
    };
    return `
    <div class="scr">
      <header class="scrhdr"><div class="hdr-title">Goals</div><div class="hdr-left"><button class="btn mini" data-act="goal-add">${IC.plus} Create Goal</button></div></header>
      <div class="card"><div class="card-title">Overview</div>
        <div class="metrics-grid">
          <div class="metric"><span class="metric-val">${rupees(totalTarget)}</span><span class="metric-lbl">Total Needed</span></div>
          <div class="metric"><span class="metric-val inc">${rupees(totalSaved)}</span><span class="metric-lbl">Saved</span></div>
          <div class="metric"><span class="metric-val neg">${rupees(totalRemaining)}</span><span class="metric-lbl">Remaining</span></div>
          <div class="metric"><span class="metric-val">${rupees(monthlyReq)}<small>/mo</small></span><span class="metric-lbl">Monthly Required</span></div>
        </div>
        <div class="status-pills" style="margin-top:14px">
          <span class="pill on">${onTrack} On Track</span>
          <span class="pill ${needsAttention?"warn":""}">${needsAttention} Need Attention</span>
          <span class="pill ${overdue?"err":""}">${overdue} Overdue</span>
          <span class="pill ${completed?"ok":""}">${completed} Completed</span>
        </div>
      </div>
      <div class="sec-label">Upcoming Goals</div>
      ${upcoming.length?upcoming.map(row).join(""):
        `<div class="card"><div class="empty"><div>${IC.target}</div><div class="t">No goals yet</div><div class="s">Create a goal for something you are saving for</div></div></div>`}
      ${done.length?`<div class="sec-label">Completed</div>
        ${done.map(row).join("")}`:""}
    </div>`;
  },
  goalCurrent(g){
    if(g&&g.sources&&g.sources.length)return g.sources.reduce((s,x)=>s+(x.amount||0),0);
    return g&&g.current||0;
  },
  goalCalc(g){
    const target=g.target||0;
    const current=this.goalCurrent(g);
    const remaining=Math.max(0,target-current);
    const pct=target>0?current/target*100:0;
    const now=new Date();
    let months=0;
    if(g.date){
      const y=parseInt(g.date.slice(0,4),10),m=parseInt(g.date.slice(5,7),10)-1;
      months=(y-now.getFullYear())*12+(m-now.getMonth());
    }
    const saveMonths=months>1?months-1:(months===1?1:0);
    const plan=g.plan||0;
    const required=saveMonths>0?Math.ceil(remaining/saveMonths/100)*100:0;
    const est=plan>0?Math.ceil(remaining/plan):null;
    const estDate=est!=null?new Date(now.getFullYear(),now.getMonth()+est,1):null;
    let status;
    if(g.completed)status="completed";
    else if(current>=target&&(!g.date||months>=0))status="completed";
    else if(months<0&&current<target)status="overdue";
    else{
      const plannedTotal=current+plan*Math.max(saveMonths,0);
      status=(saveMonths>0&&plan>0&&plannedTotal>=target)?"on-track":"needs-attention";
    }
    return {target,current,remaining,pct,months,saveMonths,required,plan,est,estDate,status};
  },
  goalStatus(g){return this.goalCalc(g).status},

  updateGoalCalc(){
    const box=document.getElementById("goal-calc");
    if(!box)return;
    const name=($("#gg-n")&&$("#gg-n").value||"").trim()||"This goal";
    const target=Math.round(parseFloat(($("#gg-t")&&$("#gg-t").value||"").replace(/,/g,""))||0)*100;
    const date=$("#gg-d")&&$("#gg-d").value||"";
    const curIn=Math.round(parseFloat(($("#gg-c")&&$("#gg-c").value||"").replace(/,/g,""))||0)*100;
    const plan=Math.round(parseFloat(($("#gg-m")&&$("#gg-m").value||"").replace(/,/g,""))||0)*100;
    const srcTotal=this.goalCurrent({sources:this._goalSources||[],current:0});
    const current=(this._goalSources&&this._goalSources.length)?srcTotal:curIn;
    if(!target){box.style.display="none";return}
    const g={id:"tmp",name,target,date,current,plan,sources:this._goalSources||[],completed:false};
    const c=this.goalCalc(g);
    const stL=c.status==="on-track"?"On Track":c.status==="needs-attention"?"Needs Attention":c.status==="overdue"?"Overdue":"Completed";
    const stC=c.status==="on-track"?"on":c.status==="needs-attention"?"warn":c.status==="overdue"?"err":"ok";
    const html=`
      <div class="goal-calc-hdr">${esc(name)} · <span class="pill ${stC}">${stL}</span></div>
      <div class="gc-grid">
        <div><span class="gc-lbl">Saved</span><span class="gc-val inc">${rupees(current)}</span></div>
        <div><span class="gc-lbl">Target</span><span class="gc-val">${rupees(target)}</span></div>
        <div><span class="gc-lbl">Remaining</span><span class="gc-val neg">${rupees(c.remaining)}</span></div>
        <div><span class="gc-lbl">Progress</span><span class="gc-val">${Math.round(c.pct)}%</span></div>
      </div>
      ${c.months>0?`<div class="gc-note">${c.status==="on-track"?"Saving "+rupees(plan)+"/mo will reach the goal on time."
        :c.status==="needs-attention"?`Need <b>${rupees(c.required)}/mo</b> to reach the target by ${parseMk(date).toLocaleDateString("en-IN",{month:"short",year:"numeric"})}${plan>0?(c.required>plan?` · currently saving ${rupees(plan)}/mo`:""):""}`
        :c.status==="completed"?"Target saved — ready to buy!":""}`
        :c.status==="overdue"?`<div class="gc-note err">Target date has passed — needs <b>${rupees(c.required)}/mo</b> now.`:""}
      ${c.status==="completed"?`<div class="gc-note ok">All ${rupees(target)} saved — you can make the purchase!</div>`:""}
    `;
    box.innerHTML=html;
    box.style.display="block";
  },
  goalDetailSheet(id){
    const g=this.data.goals.find(x=>x.id===id);if(!g)return "";
    const c=this.goalCalc(g);
    const stL={completed:"Completed","on-track":"On Track","needs-attention":"Needs Attention",overdue:"Overdue"}[c.status];
    const stC=c.status==="on-track"?"on":c.status==="needs-attention"?"warn":c.status==="overdue"?"err":"ok";
    const srcTotal=this.goalCurrent(g);
    const monthsLeft=c.saveMonths>0?c.saveMonths:(g.date?"past due":"no date");
    const dateTxt=g.date?parseMk(g.date).toLocaleDateString("en-IN",{month:"short",year:"numeric"}):"—";
    return `
      <div class="sh-grab"></div>
      <div class="sh-title">${esc(g.name)}</div>
      <div class="gd-status"><span class="pill ${stC}">${stL}</span></div>
      <div class="gd-progress"><i style="width:${Math.min(100,c.pct)}%"></i></div>
      <div class="gc-grid">
        <div><span class="gc-lbl">Saved</span><span class="gc-val inc">${rupees(c.current)}</span></div>
        <div><span class="gc-lbl">Target</span><span class="gc-val">${rupees(c.target)}</span></div>
        <div><span class="gc-lbl">Remaining</span><span class="gc-val neg">${rupees(c.remaining)}</span></div>
        <div><span class="gc-lbl">Progress</span><span class="gc-val">${Math.round(c.pct)}%</span></div>
      </div>
      ${!g.completed?`<div class="gd-note">${c.status==="on-track"?"Saving "+rupees(c.plan)+"/mo"+(g.date?" · on track for "+dateTxt:"")
        :c.status==="needs-attention"?`Needs <b>${rupees(c.required)}/mo</b> to hit the target${g.date?` by ${dateTxt}`:""}${c.plan>0?` · saving ${rupees(c.plan)}/mo`:""}`
        :c.status==="overdue"?`Target date (${dateTxt}) has passed — needs <b>${rupees(c.required)}/mo</b> now.`
        :"Target saved — ready to buy!"}</div>`:""}
      <div class="sec-label" style="margin-top:16px">Goal</div>
      <div class="slab">
        <span class="s-label">Estimated cost<div class="s-sub">${g.actualAmount?`Actual: ${rupees(g.actualAmount)} · ${g.actualAmount<=g.target?"under by "+rupees(g.target-g.actualAmount):"over by "+rupees(g.actualAmount-g.target)}`:""}</div></span>
        <span>${rupees(c.target)}</span>
      </div>
      <div class="slab">
        <span class="s-label">Expected date<div class="s-sub">${monthsLeft==="past due"?"Past due":monthsLeft==="no date"?"No date set":(monthsLeft+" month"+(monthsLeft===1?"":"s")+" left to save")}</div></span>
        <span>${dateTxt}</span>
      </div>
      <div class="slab">
        <span class="s-label">Monthly savings plan<div class="s-sub">${c.plan>0?"Estimated completion: "+(c.estDate?c.estDate.toLocaleDateString("en-IN",{month:"short",year:"numeric"}):"—"):"No monthly plan set"}</div></span>
        <span>${rupees(c.plan)}/mo</span>
      </div>
      <div class="sec-label" style="margin-top:16px">Savings Sources ${srcTotal?`· ${rupees(srcTotal)}`:"· no source yet"}</div>
      ${(g.sources&&g.sources.length)?g.sources.map(s=>`
        <div class="slab">
          <span class="s-label">${esc(s.name)}</span>
          <span>${rupees(s.amount||0)}</span>
        </div>`).join("")
        :`<div class="tsub" style="margin:0 2px 4px;color:var(--muted)">No savings source allocated yet.</div>`}
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn ghost" style="flex:1" data-act="goal-edit" data-id="${g.id}">Edit</button>
        ${!g.completed?`<button class="btn" style="flex:1" data-act="goal-complete" data-id="${g.id}">${IC.check} Purchased</button>`:""}

  /* ---------- sheet plumbing ---------- */
  openSheet(html){
    clearTimeout(App.$sheetTimer);
    $("#sheet").innerHTML=`<div class="sheet" id="sheet-body">${html}</div>`;
    $("#scrim").classList.add("on");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const sb=$("#sheet-body");if(sb)sb.classList.add("up")}));
  },
  swapSheet(html){
    $("#sheet-body").innerHTML=html;
    $("#sheet-body").scrollTop=0;
  },
  closeSheet(){
    const sb=$("#sheet-body");
    if(!sb){$("#scrim").classList.remove("on");return}
    sb.classList.remove("up");
    $("#scrim").classList.remove("on");
    this.pendingDel=null;
    clearTimeout(App.$sheetTimer);
    App.$sheetTimer=setTimeout(()=>{$("#sheet").innerHTML=""},320);
  },

  /* ---------- input handlers ---------- */
  onSearch(v){this.flt.q=v;this.render()},
  setMsd(v){this.data.settings.monthStartDay=parseInt(v,10);this.save();this.toast("Month starts on day "+v)},

  key(k){
    const a=this.add;
    if(k==="del"){a.amount=a.amount.slice(0,-1)}
    else if(k==="."){
      if(!a.amount)a.amount="0.";
      else if(!a.amount.includes("."))a.amount+=".";
    }
    else{
      if(a.amount.includes(".")&&a.amount.split(".")[1].length>=2)return;
      if(a.amount==="0")a.amount=k;
      else a.amount+=k;
      if(a.amount.length>10)return;
    }
    this.render();
  },

  /* ---------- actions ---------- */
  actions:{
    tab:(el)=>{
      const t=el.dataset.tab;App._scrollRestore=null;
      if(t!=="budget"&&App.mkey>monthKey(new Date()))App.mkey=monthKey(new Date());
      if(t==="activity"){App.view="overview";App.prevView="overview";App.render();return}
      App.view=t;App.render();
      App.prevView=t;
    },
    "close-add":()=>{App.closeSheet();App.txOpen=null;App.view=App.prevView||"overview";App.render();App.restoreScroll()},
    "close-sheet":()=>App.closeSheet(),
    "dp-open":()=>{const d=parseD(App.add.date);App.dp={y:d.getFullYear(),m:d.getMonth()};App.openSheet(App.dpSheet())},
    "dp-prev":()=>{App.dp.m--;if(App.dp.m<0){App.dp.m=11;App.dp.y--}App.swapSheet(App.dpSheet())},
    "dp-next":()=>{App.dp.m++;if(App.dp.m>11){App.dp.m=0;App.dp.y++}App.swapSheet(App.dpSheet())},
    "dp-today":()=>{const d=new Date();App.dp={y:d.getFullYear(),m:d.getMonth()};App.swapSheet(App.dpSheet())},
    "dp-pick":(el)=>{App.add.date=el.dataset.date;App.closeSheet();App.render()},

    "dp-pickcat":(el)=>{App.add.categoryId=el.dataset.id;App.closeSheet();App.render()},
    "acc-open-pick":()=>App.openSheet(App.accSheet()),
    "pick-acc":(el)=>{App.add.accountId=el.dataset.id;App.closeSheet();App.render()},
    "merch-open":()=>App.openSheet(App.merchSheet()),
    "pick-merch":(el)=>{App.add.merchantId=el.dataset.id||"";App.closeSheet();App.render()},
    "note-open":()=>{App.closeSheet();const ni=$("#note-inline");if(ni){App.render();setTimeout(()=>$("#note-inline").focus(),40)}},
    "note-save":()=>{const v=$("#nt").value.trim();App.add.note=v;App.closeSheet();App.render()},
    "seg-dir":(el)=>{
      const d=el.dataset.d||(App.add.dir==="expense"?"income":"expense");
      App.add.dir=d;
      App.closeSheet();App.render();
    },
    "key":(el)=>App.key(el.dataset.k),
    "add-save":()=>{
      const a=App.add,v=parseFloat(a.amount);
      if(!isFinite(v)||v<=0){App.toast("Enter an amount");return}
      const existing=App.txOpen&&App.data.transactions.find(x=>x.id===App.txOpen);
      if(existing){
        const before=Object.assign({},existing,{accountId:existing.accountId,dir:existing.dir,amount:existing.amount});
        Object.assign(existing,{date:a.date,dir:a.dir,amount:Math.round(v*100),
          categoryId:a.categoryId,accountId:a.accountId,note:a.note,merchantId:a.merchantId});
        App.savSync(before,existing);
        App.txOpen=null;
        App.data.settings.lastDate=a.date;
        App.data.settings.lastCategoryId=a.categoryId;
        App.data.settings.lastMerchantId=a.merchantId;
        App.save();App.add=App.freshAdd();App.view=App.prevView;App.render();
        App.restoreScroll();
        App.toast("Updated "+rupees(existing.amount));
        return;
      }
      const txn={id:uid(),date:a.date,dir:a.dir,amount:Math.round(v*100),
        categoryId:a.categoryId,accountId:a.accountId,merchantId:a.merchantId,name:"",note:a.note,createdAt:Date.now()};
      App.data.transactions.push(txn);
      App.savSync(null,txn);
      App.data.settings.lastDate=a.date;
      App.data.settings.lastCategoryId=a.categoryId;
      App.data.settings.lastMerchantId=a.merchantId;
      App.save();App.add=App.freshAdd();App.view=App.prevView;App.render();
      App.restoreScroll();
      App.toast("Added "+rupees(txn.amount));
    },
    "add-more":()=>App.openSheet(App.moreSheet()),
    "repeat-last":()=>{
      const t=App.sortedTxs()[0];
      if(!t){App.toast("No previous transaction");return}
      if(t.dir==="trans"){App.toast("Last was a transfer");return}
      App.add.amount=String(t.amount/100).replace(/\.0+$/,"");
      App.add.dir=t.dir;App.add.categoryId=t.categoryId;App.add.accountId=t.accountId;
      App.add.merchantId=t.merchantId||"";
      App.render();App.toast("Repeated last "+(t.name||catById(t.categoryId).name));
    },
    "shortcuts":()=>App.openSheet(App.shortcutsSheet()),
    "short-save":()=>{
      const a=App.add;
      App.data.shortcuts.push({id:uid(),name:a.note||"Shortcut",dir:a.dir,amount:a.amount,
        categoryId:a.categoryId,accountId:a.accountId,merchantId:a.merchantId});

      const sh=App.data.shortcuts.find(x=>x.id===el.dataset.id);if(!sh)return;

      if(sh.accountId)App.add.accountId=sh.accountId;
      if(sh.merchantId!=null)App.add.merchantId=sh.merchantId;
      if(sh.name&&sh.name!=="Shortcut")App.add.note=sh.name;
      App.closeSheet();App.render();

    "fab-add":()=>{App.prevView=App.view;App._scrollRestore=$("#screen").scrollTop;App.add=App.freshAdd();App.txOpen=null;App.view="add";App.render()},

      const inp=document.getElementById("note-inline");if(inp)inp.value=el.dataset.n;
      document.getElementById("note-sug")?.classList.remove("show")},
    "mic-tap":()=>App.toast("Voice input — coming soon"),
    "fd":(el)=>{App.flt[el.dataset.f]=el.dataset.v;App.render()},
    "open-txn":(el)=>{App.txOpen=el.dataset.id;App.pendingDel=null;App.openSheet(App.txnSheet(el.dataset.id))},
    "txn-edit":()=>{const t=App.data.transactions.find(x=>x.id===App.txOpen);if(!t)return;
      App._scrollRestore=$("#screen").scrollTop;
      App.add={amount:String(t.amount/100).replace(/\.0+$/,""),dir:t.dir,categoryId:t.categoryId,accountId:t.accountId,date:t.date,note:t.note,merchantId:t.merchantId||""};
      App.prevView=App.view;App.closeSheet();App.view="add";App.render();},
    "txn-del":(el)=>{
      const id=el.dataset.id;
      if(App.pendingDel!==id){App.pendingDel=id;App.swapSheet(App.txnSheet(id));return}
      const gone=App.data.transactions.find(x=>x.id===id);
      App.data.transactions=App.data.transactions.filter(x=>x.id!==id);
      App.savSync(gone,null);
      App.save();App.closeSheet();App.render();App.toast("Deleted");
    },
    "acc-del":(el)=>{
      const id=el.dataset.id;
      if(App.pendingDel!==id){App.pendingDel=id;App.swapSheet(App.accEditSheet(id));return}
      const delSav=accById(id)&&accById(id).kind==="savings";
      const first=App.data.accounts.find(a=>a.id!==id);
      if(!first){App.toast("Cannot delete the only account");return}
      if(delSav){
        App.data.transactions=App.data.transactions.filter(t=>!(t.dir==="trans"&&((t.from===id&&t.to==="__prev")||(t.from==="__prev"&&t.to===id))));
      }
      App.data.accounts=App.data.accounts.filter(a=>a.id!==id);
      App.data.transactions.forEach(t=>{
        if(t.accountId===id){t.accountId=first.id}
        else if(t.dir==="trans"&&(t.from===id||t.to===id)){
          if(t.from===id)t.from=first.id;
          if(t.to===id)t.to=first.id;
        }
      });
      App.save();App.closeSheet();App.render();App.toast("Account deleted");
    },
    "t-hide":()=>{App.data.settings.hideBalances=!App.data.settings.hideBalances;App.save();App.render()},

      if(pass.length<8){App.toast("Passphrase must be at least 8 characters");return}
      if(!pat||pat.length<10){App.toast("Enter a GitHub token with gist scope");return}
      if(pat.startsWith("github_pat_")){App.toast("Fine-grained tokens don't support gist scope — use a classic token (ghp_…)");return}
      if(!C.sup()){App.toast("Backup needs a secure connection — open Xpend over https://");return}
      App.closeSheet();
      try{
        const r=await Gist.connect(pass,pat);
        App.add=App.freshAdd();App.render();
        App.toast(r.restored?("Restored backup · "+r.gistId.slice(0,7)):"Backup connected");
      }catch(e){
        if(e&&e.name==="OperationError")App.toast("Wrong passphrase or corrupt backup");

/* ============================ GLOBAL CLICK DELEGATION ============================ */
document.addEventListener("click",e=>{
  if(App._swipeT){App._swipeT=0;return}
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const fn=App.actions[el.dataset.act];
  if(fn)fn(el,e);
});

/* horizontal swipe on month-total surfaces (.swipe-mk): left = previous month, right = next month.
   A real swipe also suppresses the mk-open click so the picker doesn't pop up. */
let _swipe=null;
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".swipe-mk");
  if(!el){_swipe=null;return}
  _swipe={el,x:e.clientX,y:e.clientY,t:Date.now()};
},{passive:true});
document.addEventListener("pointermove",e=>{
  if(!_swipe)return;
  const dx=e.clientX-_swipe.x,dy=e.clientY-_swipe.y;
  if(Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)>6){
    const c=Math.max(-70,Math.min(70,dx));
    _swipe.el.style.transition="none";
    _swipe.el.style.transform="translateX("+c.toFixed(1)+"px)";
  }
},{passive:true});
document.addEventListener("pointerup",e=>{
  if(!_swipe)return;
  const s=_swipe;_swipe=null;
  const dx=e.clientX-s.x;
  s.el.style.transform="";s.el.style.transition="";
  if(Math.abs(dx)>44&&Date.now()-s.t<600){
    App._swipeT=Date.now();
    setTimeout(()=>{App._swipeT=0},150);
    App.shiftMonth(dx<0?-1:1);
  }
},{passive:true});
document.addEventListener("pointercancel",()=>{
  if(_swipe){_swipe.el.style.transform="";_swipe.el.style.transition="";_swipe=null}
},{passive:true});

    if(btn)btn.disabled=!v;
  }
});

/* note autocomplete: suggest the last-used note names matching what the user is typing */
function updateNoteSug(){
  const box=document.getElementById("note-sug");
  if(!box)return;
  const v=(App.add&&App.add.note||"").trim();
  if(!v){
    box.classList.remove("show");box.innerHTML="";
    return;
  }
  const used=[];
  const seen=new Set();
  for(let i=App.data.transactions.length-1;i>=0;i--){
    const t=App.data.transactions[i];
    const n=(t.note||t.name||"").trim();
    if(!n||seen.has(n.toLowerCase()))continue;
    seen.add(n.toLowerCase());used.push(n);
  }
  const q=v.toLowerCase();
  const ranked=used
    .filter(n=>{
      const nl=n.toLowerCase();
      return nl.startsWith(q)||nl.includes(q);
    })
    .sort((a,b)=>a.toLowerCase().indexOf(q)-b.toLowerCase().indexOf(q));
  const picks=ranked.slice(0,4);
  if(!picks.length){box.classList.remove("show");box.innerHTML="";return}
  const hi=s=>{
    const i=s.toLowerCase().indexOf(q);
    if(i<0)return esc(s);
    return esc(s.slice(0,i))+"<b>"+esc(s.slice(i,i+q.length))+"</b>"+esc(s.slice(i+q.length));
  };
  box.innerHTML=picks.map(n=>`<button class="note-sug-item" data-act="note-pick" data-n="${esc(n)}">${hi(n)}</button>`).join("");
  box.classList.add("show");
}

/* iOS standalone keyboard bug: when the keyboard opens and closes, window.innerHeight
   sometimes stays stuck short, leaving a black strip at the bottom until the app is
   killed. Re-assert the layout viewport whenever the keyboard finishes closing. */
function kbFix(){
  const app=document.getElementById("app");if(!app)return;
  const meta=document.querySelector('meta[name="viewport"]');
  if(meta){
    const o=meta.getAttribute("content");
    meta.setAttribute("content",o+", kbFix");
    setTimeout(()=>meta.setAttribute("content",o),40);
  }
  window.scrollTo(0,0);
  app.style.top="0";app.style.bottom="0";
}
if(window.visualViewport){
  let kbWas=false;
  window.visualViewport.addEventListener("resize",()=>{
    const kbNow=Math.round(window.visualViewport.height)<Math.round(window.innerHeight*0.9);
    if(kbWas&&!kbNow)setTimeout(kbFix,90);
    kbWas=kbNow;
  });
}
window.addEventListener("resize",()=>kbFix());
document.addEventListener("focusout",()=>setTimeout(()=>{kbFix()},140));
